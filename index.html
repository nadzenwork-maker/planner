/* ============================= ЧТЕНИЕ ============================= */
let readMonth = monthKey(todayISO());
let readFilter = 'all';
const coverCache = {};
const BOOK_STATUS = { reading:'Читаю', done:'Прочитано', want:'Хочу прочитать' };
async function loadCover(id){
  if(coverCache[id] !== undefined) return coverCache[id];
  try{ coverCache[id] = await loadKey('cover-'+id, null); }catch(e){ coverCache[id] = null; }
  return coverCache[id];
}
function bookStarsText(n){ n = n||0; return '★'.repeat(n) + '<s>' + '★'.repeat(5-n) + '</s>'; }
function finishedIn(month){ return state.books.filter(b => b.status==='done' && b.end && b.end.slice(0,7)===month); }
function pluralBooks(n){ const m=n%10, h=n%100; return m===1&&h!==11 ? 'книга' : (m>=2&&m<=4&&(h<10||h>=20)) ? 'книги' : 'книг'; }
function bookDatesText(b){
  if(b.start && b.end) return `${fmtHuman(b.start)} — ${fmtHuman(b.end)}`;
  if(b.start) return `начала ${fmtHuman(b.start)}`;
  if(b.end) return `дочитала ${fmtHuman(b.end)}`;
  return '';
}
function renderReading(){
  const [y,m] = readMonth.split('-').map(Number);
  const monthBooks = finishedIn(readMonth);
  const yearDone = state.books.filter(b => b.status==='done' && b.end && b.end.slice(0,4)===String(y));
  const perMonth = Array.from({length:12}, (_,i) => finishedIn(`${y}-${pad2(i+1)}`).length);
  const maxBar = Math.max(1, ...perMonth);
  const MON_S = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const MON_PREP = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
  let list;
  if(readFilter==='month') list = monthBooks;
  else if(readFilter==='all') list = [...state.books];
  else list = state.books.filter(b => b.status===readFilter);
  const rank = { reading:0, done:1, want:2 };
  list.sort((a,b) => (rank[a.status]-rank[b.status]) || String(b.end||b.start||'').localeCompare(String(a.end||a.start||'')) || (b.createdAt||0)-(a.createdAt||0));
  const counts = { all: state.books.length, reading: state.books.filter(b=>b.status==='reading').length, done: state.books.filter(b=>b.status==='done').length, want: state.books.filter(b=>b.status==='want').length };

  $('#tab-reading').innerHTML = `
    <div class="cal-header" style="margin-top:6px">
      <button class="cal-nav" id="rdPrev" aria-label="Предыдущий месяц">${icon('chevLeft')}</button>
      <h2>${MONTHS_NOM[m-1]} ${y}</h2>
      <button class="cal-nav" id="rdNext" aria-label="Следующий месяц">${icon('chevRight')}</button>
    </div>
    <div class="card">
      <div class="rd-hero">
        <div class="rd-count">${monthBooks.length}<small>${pluralBooks(monthBooks.length)} ${(monthBooks.length%10===1 && monthBooks.length%100!==11) ? 'прочитана' : 'прочитано'} в ${MON_PREP[m-1]}</small></div>
        <div class="rd-year">За ${y} год: <b style="color:var(--text)">${yearDone.length}</b> ${pluralBooks(yearDone.length)}${counts.reading?`<br>Сейчас читаю: ${counts.reading}`:''}</div>
      </div>
      <div class="rd-bars" role="group" aria-label="Книги по месяцам">
        ${perMonth.map((n,i) => `<button class="rd-bar ${i===m-1?'cur':''}" data-rdm="${y}-${pad2(i+1)}" aria-label="${MONTHS_NOM[i]}: ${n}"><em>${n||''}</em><i style="height:${Math.round(n/maxBar*52)+4}px"></i><b>${MON_S[i]}</b></button>`).join('')}
      </div>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <div class="rd-filters" role="group" aria-label="Фильтр">
        ${[['all','Все'],['month','За месяц'],['reading','Читаю'],['done','Прочитано'],['want','Хочу']].map(([k,n]) => `<button class="pill ${readFilter===k?'active':''}" data-rdf="${k}">${n}${k==='month'?` · ${monthBooks.length}`:counts[k]!==undefined?` · ${counts[k]}`:''}</button>`).join('')}
      </div>
      <button class="btn btn-primary" id="rdAdd" style="background:var(--read); color:#fff; display:flex; align-items:center; gap:6px;">${icon('plus')} Книга</button>
    </div>
    ${list.length ? `<div class="rd-grid">${list.map(b => `
      <button class="bk" data-book="${b.id}">
        <span class="bk-cover" data-cover="${b.id}">${b.hasCover ? '' : icon('openbook')}</span>
        <span class="bk-body">
          <span class="bk-top"><span class="bk-author">${escapeHtml(b.author||'')}</span><span class="bk-status ${b.status}">${BOOK_STATUS[b.status]}</span></span>
          <span class="bk-title">${escapeHtml(b.title || 'Без названия')}</span>
          ${bookDatesText(b) ? `<span class="bk-dates">${bookDatesText(b)}</span>` : ''}
          ${(b.plot||b.chars||b.atmo) ? `<span class="bk-rates">
            <span>Сюжет</span><span class="bk-stars">${bookStarsText(b.plot)}</span>
            <span>Персонажи</span><span class="bk-stars">${bookStarsText(b.chars)}</span>
            <span>Атмосфера</span><span class="bk-stars">${bookStarsText(b.atmo)}</span>
          </span>` : ''}
          ${b.notes ? `<span class="bk-notes">${escapeHtml(b.notes)}</span>` : ''}
        </span>
      </button>`).join('')}</div>`
      : `<div class="card rd-empty">${readFilter==='month' ? `В ${MON_PREP[m-1]} пока ничего не дочитано.` : 'Здесь пока пусто. Добавь книгу, которую читаешь сейчас.'}</div>`}
  `;
  $('#rdPrev').addEventListener('click', ()=>{ readMonth = shiftMonth(readMonth,-1); renderReading(); });
  $('#rdNext').addEventListener('click', ()=>{ readMonth = shiftMonth(readMonth,1); renderReading(); });
  $$('[data-rdm]').forEach(b => b.addEventListener('click', ()=>{ readMonth = b.dataset.rdm; readFilter = 'month'; renderReading(); }));
  $$('[data-rdf]').forEach(b => b.addEventListener('click', ()=>{ readFilter = b.dataset.rdf; renderReading(); }));
  $('#rdAdd').addEventListener('click', ()=> openBookModal(null));
  $$('[data-book]').forEach(b => b.addEventListener('click', ()=> openBookModal(b.dataset.book)));
  // обложки подгружаем отдельно, чтобы раздел открывался быстро
  list.filter(b => b.hasCover).forEach(async b => {
    const src = await loadCover(b.id);
    const el = document.querySelector(`[data-cover="${b.id}"]`);
    if(el && src){ el.style.backgroundImage = `url('${src}')`; el.innerHTML = ''; }
  });
}

function blogPubStats(start, end, weeks){

const CARD_FONT_BASE = 'https://cdn.jsdelivr.net/npm/@fontsource/';
let cardFontsReady = null;
function loadCardFonts(){
  if(cardFontsReady) return cardFontsReady;
  const LAT = 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD';
  const CYR = 'U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116';
  const list = [];
  [['CardUnb','unbounded',[400,800]],['CardMan','manrope',[600,700,800]]].forEach(([fam,pkg,ws]) => ws.forEach(w => [['latin',LAT],['cyrillic',CYR]].forEach(([sub,range]) => {
    list.push(new FontFace(fam, `url(${CARD_FONT_BASE}${pkg}@5.2.8/files/${pkg}-${sub}-${w}-normal.woff2)`, { weight:String(w), unicodeRange:range }));
  })));
  cardFontsReady = Promise.all(list.map(f => f.load().then(ff => document.fonts.add(ff)).catch(()=>null)));
  return cardFontsReady;
}
const CARD = { W:1080, H:1350, P:64, bg:'#F6F1EE', text:'#1C1416', muted:'#9A8E8C', tile:'#FFFFFF', track:'#F1E6E4', red:'#D41F2A', green:'#23A065', yellow:'#D49A1A', dark:'#1C1416', light:'#F6F1EE' };
const cardColor = p => p>=80 ? CARD.green : p>=50 ? CARD.yellow : CARD.red;
function cardRR(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function cardSpaced(ctx, s, x, y, sp){ for(const ch of s){ ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + sp; } return x; }
function cardWrap(ctx, s, maxW, maxLines){
  const words = String(s||'').split(/\s+/).filter(Boolean); const lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur+' '+w : w; if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = w; } else cur = t; });
  if(cur) lines.push(cur);
  if(lines.length > maxLines){ const l = lines.slice(0,maxLines); let last = l[maxLines-1]; while(ctx.measureText(last+'…').width > maxW && last.length) last = last.slice(0,-1); l[maxLines-1] = last.trim()+'…'; return l; }
  return lines;
}
const cardNoEmoji = s => String(s||'').replace(/[\p{Extended_Pictographic}‍️]/gu,'').replace(/\s+/g,' ').trim();
function cardLoadImg(src){ return new Promise(res => { const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>res(null); i.src = src; }); }
function isoWeekNum(iso){ const d = parseISO(iso); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); }

function cardData(mode, cursor, highlight){
  const { start, end } = periodRange(mode, cursor);
  const t = todayISO(), endC = end < t ? end : t;
  const ts = tasksStatsForRange(start, end), cr = carriesForRange(start, end);
  const hs = habitsStatsForRange(start, endC);
  const days = Math.round((parseISO(end)-parseISO(start))/864e5)+1, weeks = Math.max(1, Math.round(days/7));
  const wo = state.workouts.filter(w=>w.date>=start && w.date<=end);
  const bst = blogPubStats(start, end, days/7);
  const js = journalStatsForRange(start, end);
  const done = (state.books||[]).filter(b=>b.status==='done' && b.end && b.end>=start && b.end<=end).sort((a,b)=>String(b.end).localeCompare(String(a.end)));
  const reading = (state.books||[]).filter(b=>b.status==='reading');
  const [s1,e1] = [parseISO(start), parseISO(end)];
  const period = mode==='week'
    ? (s1.getMonth()===e1.getMonth() ? [`${s1.getDate()}–${e1.getDate()} `, MONTHS[e1.getMonth()]] : [`${s1.getDate()} ${MONTHS[s1.getMonth()].slice(0,3)} – ${e1.getDate()} `, MONTHS[e1.getMonth()].slice(0,3)])
    : ['', `${MONTHS_NOM[s1.getMonth()].toLowerCase()} ${s1.getFullYear()}`];
  return {
    mode, period, highlight: highlight||'',
    label: mode==='week' ? 'ИТОГИ НЕДЕЛИ' : 'ИТОГИ МЕСЯЦА',
    tag: mode==='week' ? `неделя ${isoWeekNum(start)}` : `${days} дней`,
    avg: js.avg!==null ? js.avg.toFixed(1).replace('.',',') : null,
    tasks: { done: ts.done, total: ts.total, pct: ts.total ? Math.round(ts.done/ts.total*100) : 0, ontime: cr.onTimePct },
    habits: { pct: hs.avgPct, n: hs.results.length },
    sport: { w: wo.length, goal: 3*weeks, min: wo.reduce((a,w)=>a+(+w.duration||0),0), pct: Math.min(100, Math.round(wo.length/(3*weeks)*100)) },
    blog: { n: bst.n, of: Math.round(bst.goal), pct: bst.pct },
    book: done.length ? { lbl: done.length>1 ? `ДОЧИТАЛА · ${done.length}` : 'ДОЧИТАЛА', t: done[0].title||'Без названия', a: done[0].author||'', id: done[0].id, hasCover: !!done[0].hasCover } : reading.length ? { lbl:'ЧИТАЮ', t: reading[0].title||'Без названия', a: reading[0].author||'', id: reading[0].id, hasCover: !!reading[0].hasCover } : null,
    jphotos: js.photos.map(e=>({ date:e.date, src:e.photo })),
    photos: js.photos.map(e=>e.photo).slice(-4),
  };
}

async function drawBlogCard(d, opt){
  await loadCardFonts();
  let coverImg = null;
  if(opt.book && d.book && d.book.hasCover){ try{ const src = await loadCover(d.book.id); if(src) coverImg = await cardLoadImg(src); }catch(e){} }
  const C = CARD, W = C.W, P = C.P, cw = W - 2*P, gap = 18;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = C.H;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = C.bg; ctx.fillRect(0,0,W,C.H);
  ctx.textBaseline = 'alphabetic';
  // шапка
  ctx.fillStyle = C.muted; ctx.font = '800 22px CardMan'; cardSpaced(ctx, d.label, P, 92, 4.8);
  ctx.font = `800 ${d.mode==='week'?84:72}px CardUnb`;
  let x = P; ctx.fillStyle = C.text; ctx.fillText(d.period[0], x, 190); x += ctx.measureText(d.period[0]).width;
  ctx.fillStyle = C.red; ctx.fillText(d.period[1], x, 190);
  if(opt.avg && d.avg){
    ctx.font = '800 26px CardUnb'; const s = `★ ${d.avg}`, bw = ctx.measureText(s).width + 48;
    ctx.fillStyle = C.red; cardRR(ctx, W-P-bw, 140, bw, 60, 30); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillText(s, W-P-bw+24, 180);
  }
  let y = 234;
  { // если фото нет — центрируем блок плиток между шапкой и подвалом
    const willPhotos = opt.photos && d.photos.length;
    if(!willPhotos){
      let h = 0, rows = 0;
      if(opt.highlight && d.highlight){ ctx.font = '800 40px CardMan'; h += 104 + cardWrap(ctx, d.highlight, cw-72, 2).length*49; rows++; }
      if(opt.tasks || opt.habits){ h += 264; rows++; }
      if(opt.sport || opt.blog || (opt.book && d.book)){ h += 252; rows++; }
      h += Math.max(0, rows-1)*gap;
      y += Math.max(0, Math.round((1278 - 70 - 234 - h)/2));
    }
  }
  const tile = (tx,ty,tw,th,bg) => { ctx.fillStyle = bg||C.tile; cardRR(ctx,tx,ty,tw,th,32); ctx.fill(); };
  const lbl = (s,tx,ty,color,dotPct) => { ctx.font = '800 19px CardMan'; ctx.fillStyle = color||C.muted; const ex = cardSpaced(ctx, s, tx, ty, 2.7); if(dotPct!==undefined){ ctx.fillStyle = cardColor(dotPct); ctx.beginPath(); ctx.arc(ex+12, ty-7, 7, 0, Math.PI*2); ctx.fill(); } };
  const big = (n, of, tx, ty, size) => { ctx.font = `800 ${size}px CardUnb`; ctx.fillStyle = C.text; ctx.fillText(n, tx, ty); const nx = tx + ctx.measureText(n).width + 2; if(of){ ctx.font = `400 ${Math.round(size*0.43)}px CardUnb`; ctx.fillStyle = C.muted; ctx.fillText(of, nx, ty); } };
  const bar = (pct, tx, ty, tw) => { ctx.fillStyle = C.track; cardRR(ctx,tx,ty,tw,12,6); ctx.fill(); if(pct>0){ ctx.fillStyle = cardColor(pct); cardRR(ctx,tx,ty,Math.max(12,tw*Math.min(100,pct)/100),12,6); ctx.fill(); } };
  const sub = (s, tx, ty, color) => { ctx.font = '600 22px CardMan'; ctx.fillStyle = color||C.muted; ctx.fillText(s, tx, ty); };
  // главное
  if(opt.highlight && d.highlight){
    ctx.font = '800 40px CardMan'; const lines = cardWrap(ctx, d.highlight, cw-72, 2);
    const th = 104 + lines.length*49;
    const g = ctx.createLinearGradient(P, y, P+cw, y+th); g.addColorStop(0,'#A80F1C'); g.addColorStop(.6,'#D41F2A'); g.addColorStop(1,'#E8333A');
    tile(P,y,cw,th,g);
    ctx.font = '800 19px CardMan'; ctx.fillStyle = 'rgba(255,255,255,.72)'; cardSpaced(ctx, d.mode==='week'?'ГЛАВНОЕ ЗА НЕДЕЛЮ':'ГЛАВНОЕ ЗА МЕСЯЦ', P+36, y+52, 2.7);
    ctx.font = '800 40px CardMan'; ctx.fillStyle = '#fff'; lines.forEach((l,i)=> ctx.fillText(l, P+36, y+108+i*49));
    y += th + gap;
  }
  // ряд 1: задачи + привычки, ряд 2: спорт + блог + книга
  const metric = (tx, tw, th, name, pct, n, of, line, extra) => {
    tile(tx,y,tw,th); lbl(name, tx+30, y+50, null, pct);
    const sz = th>=260 ? 84 : 72; big(String(n), of, tx+30, y+(th>=260?150:140), sz);
    if(extra) extra(tx, y+(th>=260?194:184)); else sub(line, tx+30, y+(th>=260?194:184));
    bar(pct, tx+30, y+th-40, tw-60);
  };
  const row2 = [];
  if(opt.tasks) row2.push((tx,tw) => metric(tx, tw, 264, 'ЗАДАЧИ', d.tasks.pct, d.tasks.done, '/'+d.tasks.total, '', (ex,ey) => {
    ctx.font = '600 22px CardMan'; ctx.fillStyle = C.muted; ctx.fillText('в срок ', ex+30, ey); const ox = ex+30+ctx.measureText('в срок ').width;
    ctx.font = '800 22px CardMan'; ctx.fillStyle = cardColor(d.tasks.ontime); ctx.fillText(d.tasks.ontime+'%', ox, ey); }));
  if(opt.habits) row2.push((tx,tw) => metric(tx, tw, 264, 'ПРИВЫЧКИ', d.habits.pct, d.habits.pct, '%', d.mode==='week' ? 'в среднем за неделю' : 'в среднем за месяц'));
  if(row2.length){ const tw = (cw - gap*(row2.length-1))/row2.length; row2.forEach((f,i)=> f(P + i*(tw+gap), tw)); y += 264 + gap; }
  const row3 = [];
  if(opt.sport) row3.push((tx,tw) => metric(tx, tw, 252, 'СПОРТ', d.sport.pct, d.sport.w, '/'+d.sport.goal, d.sport.min ? `${d.sport.min} минут` : 'тренировок'));
  if(opt.blog) row3.push((tx,tw) => metric(tx, tw, 252, 'БЛОГ', d.blog.pct, d.blog.n, '/'+d.blog.of, 'публикаций'));
  const w3 = [];
  if(opt.sport) w3.push(1); if(opt.blog) w3.push(1);
  if(opt.book && d.book) row3.push((tx,tw) => { tile(tx,y,tw,252,C.dark);
    let txX = tx+30, txW = tw-60;
    if(coverImg){ // обложка слева, текст справа
      const ch = 252-44, cwid = Math.round(ch*2/3), cx = tx+22, cy = y+22;
      ctx.save(); cardRR(ctx, cx, cy, cwid, ch, 12); ctx.clip();
      const sc = Math.max(cwid/coverImg.width, ch/coverImg.height); ctx.drawImage(coverImg, cx+(cwid-coverImg.width*sc)/2, cy+(ch-coverImg.height*sc)/2, coverImg.width*sc, coverImg.height*sc);
      ctx.restore(); txX = cx + cwid + 24; txW = tx + tw - 26 - txX;
    }
    lbl(d.book.lbl, txX, y+50, 'rgba(246,241,238,.6)');
    const fs = coverImg ? 26 : 30, lh = coverImg ? 31 : 35;
    ctx.font = `800 ${fs}px CardMan`; ctx.fillStyle = C.light; const ls = cardWrap(ctx, d.book.t, txW, coverImg ? 4 : 3); ls.forEach((l,i)=>ctx.fillText(l, txX, y+98+i*lh));
    if(d.book.a){ ctx.font = '600 20px CardMan'; ctx.fillStyle = 'rgba(246,241,238,.7)'; ctx.fillText(cardWrap(ctx, d.book.a, txW, 1)[0], txX, y+98+ls.length*lh+10); } });
  if(opt.book && d.book) w3.push(coverImg ? (w3.length ? 1.6 : 1) : 1);
  if(row3.length){ const tot = w3.reduce((a,b)=>a+b,0), free = cw - gap*(row3.length-1); let xx = P; row3.forEach((f,i)=>{ const tw = free*w3[i]/tot; f(xx, tw); xx += tw + gap; }); y += 252 + gap; }
  // фото
  const footY = 1278;
  if(opt.photos && d.photos.length){
    const imgs = (await Promise.all(d.photos.map(cardLoadImg))).filter(Boolean);
    const ph = Math.min(footY - 70 - y, imgs.length<=2 ? 330 : 250);
    if(imgs.length && ph > 120){
      const pw = (cw - 14*(imgs.length-1))/imgs.length;
      imgs.forEach((im,i) => { const px = P + i*(pw+14); ctx.save(); cardRR(ctx,px,y,pw,ph,26); ctx.clip();
        const s = Math.max(pw/im.width, ph/im.height), iw = im.width*s, ih = im.height*s; ctx.drawImage(im, px+(pw-iw)/2, y+(ph-ih)/2, iw, ih); ctx.restore(); });
    }
  }
  // подвал
  ctx.font = '800 24px CardUnb'; ctx.fillStyle = C.text; const bx = P; ctx.fillText('а надя будет мясо', bx, footY); ctx.fillStyle = C.red; ctx.fillText('?', bx + ctx.measureText('а надя будет мясо').width, footY);
  ctx.font = '700 22px CardMan'; ctx.fillStyle = C.muted; ctx.textAlign = 'right'; ctx.fillText(d.tag, W-P, footY); ctx.textAlign = 'left';
  return cv;
}

let blogCardOpt = { highlight:true, avg:true, tasks:true, habits:true, sport:true, blog:true, book:true, photos:true };
try{ const s = JSON.parse(localStorage.getItem('planner-cardopt')||'null'); if(s) blogCardOpt = Object.assign(blogCardOpt, s); }catch(e){}
function openBlogCard(mode, cursor, highlight){
  const d = cardData(mode, cursor, highlight);
  const items = [['highlight','Главное'],['avg','Оценка ★'],['tasks','Задачи'],['habits','Привычки'],['sport','Спорт'],['blog','Блог'],['book','Книга'],['photos','Фото']];
  openModal(`
    <div class="modal-title">Карточка для блога</div>
    <div class="card-prev"><div class="card-load"><div class="spinner"></div></div><img id="cardImg" alt="Карточка"></div>
    <div class="card-ph-head"><b>Фото на карточке</b><button class="bl-link" id="cardPhReset" style="color:#D41F2A">вернуть из дневника</button></div>
    <div class="card-ph" id="cardPh"></div>
    <div class="card-ph-pick" id="cardPhPick" style="display:none"></div>
    <input type="file" accept="image/*" id="cardPhFile" style="display:none">
    <div class="card-opts">${items.map(([k,l])=>`<button class="pill ${blogCardOpt[k]?'active':''}" data-cardopt="${k}">${l}</button>`).join('')}</div>
    ${!d.highlight ? '<div class="hint" style="margin:8px 0 0">Главное событие пустое — впиши его в ретро, и оно появится на карточке.</div>' : ''}
    <div class="modal-actions"><button class="btn" id="cardSave">Сохранить</button>${navigator.share ? '<button class="btn btn-primary" id="cardShare" style="background:#D41F2A;color:#fff">Поделиться</button>' : ''}</div>`, async root => {
    let blob = null;
    const phKey = `cardph-${mode}-${cursor}`;
    // фото: ссылки на дневник {j:дата} или свои {c:dataURL}
    const defRefs = () => d.jphotos.slice(-4).map(p => ({ j:p.date }));
    let refs = defRefs();
    try{ const saved = await loadKey(phKey, null); if(Array.isArray(saved)) refs = saved; }catch(e){}
    let slot = -1; // какой слот меняем (-1 — добавляем новый)
    const resolve = r => r.c ? r.c : ((d.jphotos.find(p=>p.date===r.j)||{}).src || null);
    const syncPhotos = () => { refs = refs.filter(r => resolve(r)); d.photos = refs.map(resolve); };
    const savePh = () => saveKey(phKey, refs);
    const renderPh = () => {
      syncPhotos();
      $('#cardPh', root).innerHTML = refs.map((r,i)=>`<div class="card-ph-it"><img src="${resolve(r)}" data-phslot="${i}" alt=""><button data-phdel="${i}" aria-label="Убрать">${icon('x')}</button></div>`).join('')
        + (refs.length<4 ? `<button class="card-ph-add" id="cardPhAdd">${icon('plus')}</button>` : '');
      $$('[data-phslot]', root).forEach(el => el.addEventListener('click', ()=>{ slot = +el.dataset.phslot; openPick(); }));
      $$('[data-phdel]', root).forEach(el => el.addEventListener('click', ()=>{ refs.splice(+el.dataset.phdel,1); savePh(); $('#cardPhPick', root).style.display='none'; renderPh(); redraw(); }));
      const add = $('#cardPhAdd', root); if(add) add.addEventListener('click', ()=>{ slot = -1; openPick(); });
    };
    const put = r => { if(slot>=0) refs[slot] = r; else refs.push(r); savePh(); $('#cardPhPick', root).style.display='none'; renderPh(); redraw(); };
    const openPick = () => {
      const used = new Set(refs.filter(r=>r.j).map(r=>r.j));
      const free = d.jphotos.filter(p=>!used.has(p.date));
      const box = $('#cardPhPick', root);
      box.innerHTML = `<div class="hint" style="margin:0 0 6px">${slot>=0?'Заменить на':'Добавить'}:</div><div class="card-ph">`
        + `<button class="card-ph-add up" id="cardPhUp">${icon('camera')}<span>Загрузить</span></button>`
        + free.map(p=>`<div class="card-ph-it"><img src="${p.src}" data-phj="${p.date}" alt=""><em>${fmtHuman(p.date)}</em></div>`).join('') + `</div>`;
      box.style.display = '';
      $('#cardPhUp', root).addEventListener('click', ()=> $('#cardPhFile', root).click());
      $$('[data-phj]', box).forEach(el => el.addEventListener('click', ()=> put({ j: el.dataset.phj })));
    };
    $('#cardPhFile', root).addEventListener('change', async e => {
      const f = e.target.files[0]; e.target.value = ''; if(!f) return;
      try{ put({ c: await compressImage(f, 1200, 0.85) }); }catch(err){}
    });
    $('#cardPhReset', root).addEventListener('click', ()=>{ refs = defRefs(); savePh(); $('#cardPhPick', root).style.display='none'; renderPh(); redraw(); });
    const fname = `itogi-${mode==='week'?'nedeli':'mesyaca'}-${cursor}.png`;
    const redraw = async () => {
      $('.card-load', root).style.display = '';
      const cv = await drawBlogCard(d, blogCardOpt);
      blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      const img = $('#cardImg', root); if(img.src) URL.revokeObjectURL(img.src); img.src = URL.createObjectURL(blob);
      $('.card-load', root).style.display = 'none';
    };
    $$('[data-cardopt]', root).forEach(b => b.addEventListener('click', ()=>{
      const k = b.dataset.cardopt; blogCardOpt[k] = !blogCardOpt[k]; b.classList.toggle('active', blogCardOpt[k]);
      try{ localStorage.setItem('planner-cardopt', JSON.stringify(blogCardOpt)); }catch(e){}
      redraw();
    }));
    renderPh();
    $('#cardSave', root).addEventListener('click', ()=>{ if(!blob) return; const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname; document.body.appendChild(a); a.click(); a.remove(); });
    const sh = $('#cardShare', root);
    if(sh) sh.addEventListener('click', async ()=>{
      if(!blob) return; const file = new File([blob], fname, { type:'image/png' });
      try{ if(navigator.canShare && navigator.canShare({ files:[file] })) await navigator.share({ files:[file] }); else $('#cardSave', root).click(); }catch(e){}
    });
    redraw();
  });
}

/* ============================= INIT ============================= */
let appStarted = false;
async function startApp(){
  if(appStarted) return; appStarted = true;
  $('#loginScreen').style.display = 'none';
  $('#loadingScreen').style.display = '';
  renderAllHeader();
  renderNav();
  $('#settingsBtn').innerHTML = icon('settings');
  $('#settingsBtn').addEventListener('click', openSettingsModal);
  $('#syncBadge').addEventListener('click', ()=>{ if(syncStatus==='error'||syncStatus==='offline') retryAllSaves(); });
  const sbOk = await testSupabase();
  storageMode = sbOk ? 'supabase' : 'claude';
  setSyncStatus('saved');
  await loadAll();
  renderDay();
  $('#loadingScreen').style.display = 'none';
}
function showLogin(msg){
  $('#loadingScreen').style.display = 'none';
  $('#loginScreen').style.display = '';
  if(msg) $('#loginMsg').textContent = msg;
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginMsg').textContent = 'Вхожу…';
  const { error } = await sbClient.auth.signInWithPassword({ email: $('#loginEmail').value.trim(), password: $('#loginPass').value });
  if(error){ $('#loginMsg').textContent = /invalid/i.test(error.message) ? 'Почта или пароль не подходят.' : 'Не получилось: ' + error.message; return; }
  startApp();
});
$('#forgotBtn').addEventListener('click', async () => {
  $('#loginMsg').textContent = 'Отправляю письмо…';
  const { error } = await sbClient.auth.resetPasswordForEmail($('#loginEmail').value.trim(), { redirectTo: location.origin + location.pathname });
  $('#loginMsg').textContent = error ? 'Не получилось: ' + error.message : 'Письмо отправлено. Перейди по ссылке из него — здесь появится поле для нового пароля.';
});
$('#newPassForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sbClient.auth.updateUser({ password: $('#newPass').value });
  if(error){ $('#loginMsg').textContent = 'Не получилось: ' + error.message; return; }
  startApp();
});
sbClient.auth.onAuthStateChange((ev) => {
  if(ev === 'PASSWORD_RECOVERY'){
    showLogin('Придумай новый пароль.');
    $('#loginForm').style.display = 'none'; $('#forgotBtn').style.display = 'none'; $('#newPassForm').style.display = '';
  }
});
async function signOut(){ await sbClient.auth.signOut(); try{ Object.keys(localStorage).filter(k=>k.startsWith(LOCAL_PREFIX)).forEach(k=>localStorage.removeItem(k)); }catch(e){} location.reload(); }
// вернулась во вкладку — подтягиваем то, что мог поменять Майк
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState !== 'visible' || !appStarted || pendingKeys.size) return;
  if($('#modalBackdrop').classList.contains('open')) return;
  try{ await loadAll(); renderActive(); }catch(e){}
});
(async function init(){
  if(/type=recovery/.test(location.hash + location.search)) return; // ждём PASSWORD_RECOVERY
  const { data } = await sbClient.auth.getSession();
  const email = data.session && (data.session.user.email||'').toLowerCase();
  if(email === OWNER_EMAIL) startApp();
  else { if(data.session) await sbClient.auth.signOut(); showLogin(); }
})();
