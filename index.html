<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Планер</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA;
    --surface:#FFFFFF;
    --surface2:#F0F2F5;
    --border:#E3E6EA;
    --text:#2E3238;
    --text-muted:#767C85;
    --text-faint:#A8AEB6;
    --work:#D68A3A;
    --work-dim:#FBF0DE;
    --home:#CD7C60;
    --home-dim:#FAEAE3;
    --habit:#6FA36A;
    --habit-dim:#E7F3E5;
    --sport:#4E93B8;
    --sport-dim:#E5F2F8;
    --journal:#C17998;
    --journal-dim:#F8E9EF;
    --goal:#9077BB;
    --goal-dim:#F1ECFA;
    --danger:#C55F52;
    --radius:16px;
    --radius-sm:10px;
    --shadow:0 1px 3px rgba(30,35,45,.06), 0 1px 2px rgba(30,35,45,.04);
    --app-max:520px;
  }
  @media (min-width:700px){ :root{ --app-max:820px; } }
  @media (min-width:1100px){ :root{ --app-max:1040px; } }
  @media (min-width:1400px){ :root{ --app-max:1320px; } }
  @media (min-width:1700px){ :root{ --app-max:1560px; } }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px; line-height:1.45;
    overscroll-behavior-y:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  h1,h2,h3,.mn{font-family:'Manrope',system-ui,sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit; font-size:15px;}
  ::selection{background:var(--work); color:#1E1A22;}

  #app{max-width:var(--app-max); margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; position:relative; transition:max-width .2s;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--bg) 70%, rgba(30,26,34,0));
    padding:18px 18px 10px;
  }
  header.top .date{color:var(--text-faint); font-size:12.5px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px;}
  header.top h1{font-size:22px; margin:0; font-weight:800;}

  main{flex:1; padding:0 14px 100px; overflow-x:hidden;}
  .tabpanel{display:none; animation:fadeIn .25s ease;}
  .tabpanel.active{display:block;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px)} to{opacity:1; transform:translateY(0)}}

  /* ---- cards / sections ---- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:12px; box-shadow:var(--shadow);}
  .section-title{display:flex; align-items:center; justify-content:space-between; margin:22px 4px 10px;}
  .section-title h2{font-size:14px; margin:0; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); font-weight:700;}
  .section-title .count{font-size:12px; color:var(--text-faint); font-weight:600;}
  .accent-dot{width:7px; height:7px; border-radius:50%; display:inline-block; margin-right:7px;}

  /* ---- slots / task rows (signature: ruled list) ---- */
  .slotlist{border-left:2px dashed var(--border); padding-left:12px; margin-left:2px;}
  .taskrow{
    display:flex; align-items:flex-start; gap:10px; padding:10px 0;
    border-bottom:1px dashed var(--border);
  }
  .taskrow:last-child{border-bottom:none;}
  .checkbox{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--text-faint);
    flex:0 0 20px; margin-top:1px; display:flex; align-items:center; justify-content:center;
    transition:.15s; background:transparent;
  }
  .checkbox.done{background:var(--work); border-color:var(--work); color:#fff;}
  .checkbox.done.home{background:var(--home); border-color:var(--home);}
  .checkbox svg{width:12px; height:12px; opacity:0; transition:.15s;}
  .checkbox.done svg{opacity:1;}
  .taskbody{flex:1; min-width:0;}
  .tasktext{font-size:15px; word-break:break-word;}
  .tasktext.done{color:var(--text-faint); text-decoration:line-through;}
  .taskmeta{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px;}
  .chip{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--surface2); color:var(--text-muted); font-weight:600;}
  .chip.sub{background:transparent; border:1px solid var(--border);}
  svg{width:18px; height:18px; flex-shrink:0; display:block;}
  .delbtn svg{width:16px; height:16px;}
  .reorder-btn{background:none; border:none; color:var(--text-faint); padding:1px; flex:0 0 auto;}
  .reorder-btn svg{width:14px; height:14px;}
  .reorder-btn:disabled{opacity:.25;}
  .delbtn{background:none; border:none; color:var(--text-faint); padding:4px; flex:0 0 auto;}
  .addslot{
    display:flex; align-items:center; gap:10px; padding:10px 0; color:var(--text-faint);
    border-bottom:1px dashed var(--border); background:none; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left; font-size:15px;
  }
  .addslot:last-child{border-bottom:none;}
  .addslot .plusring{width:20px; height:20px; border-radius:50%; border:2px dashed var(--text-faint); flex:0 0 20px; display:flex; align-items:center; justify-content:center; font-size:13px;}

  .inbox-tabs{display:flex; gap:8px; margin:10px 0 8px;}
  .pill{padding:6px 14px; border-radius:20px; font-size:13px; font-weight:700; border:1px solid var(--border); background:var(--surface); color:var(--text-muted);}
  .pill.active.work{background:var(--work-dim); color:var(--work); border-color:var(--work);}
  .pill.active.home{background:var(--home-dim); color:var(--home); border-color:var(--home);}
  .quickadd{display:flex; gap:8px; margin-bottom:8px;}
  .quickadd input{flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:9px 12px; color:var(--text);}
  .quickadd button{background:var(--work); border:none; border-radius:var(--radius-sm); padding:0 14px; color:#1E1A22; font-weight:800;}

  /* ---- buttons generic ---- */
  .btn{background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; color:var(--text); font-weight:700; font-size:14px;}
  .btn-primary{background:var(--work); color:#1E1A22; border:none;}
  .btn.small{padding:6px 10px; font-size:12.5px;}
  .row-gap{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---- bottom nav ---- */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(255,255,255,.9); backdrop-filter:blur(14px);
    border-top:1px solid var(--border);
    padding:8px 4px calc(6px + env(safe-area-inset-bottom));
  }
  nav.bottom .navwrap{max-width:var(--app-max); margin:0 auto; display:flex; justify-content:space-around;}
  .navbtn{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); padding:4px 2px; flex:1; min-width:0;}
  .navbtn svg{width:21px; height:21px; transition:.15s;}
  .navbtn span{font-size:9.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .navbtn.active{color:var(--text);}
  .navbtn.active svg{transform:translateY(-1px);}

  /* ---- calendar ---- */
  .cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-header h2{font-size:17px; margin:0; font-weight:800;}
  .cal-nav{background:var(--surface); border:1px solid var(--border); width:34px; height:34px; border-radius:50%; color:var(--text); display:flex; align-items:center; justify-content:center;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:5px;}
  .cal-dow{text-align:center; font-size:11px; color:var(--text-faint); font-weight:700; padding-bottom:4px;}
  .cal-cell{aspect-ratio:1; border-radius:11px; background:var(--surface); border:1px solid var(--border); position:relative; color:var(--text-muted); box-shadow:var(--shadow); font-size:13px; cursor:pointer;}
  .cal-cell.faded{opacity:.28; display:flex; align-items:center; justify-content:center; cursor:default;}
  .cal-cell.today{border-color:var(--work); color:var(--text); font-weight:800;}
  .cal-daynum{position:absolute; top:6px; left:7px; font-size:12px;}
  .cal-rating{position:absolute; top:5px; right:6px; font-size:9.5px; font-weight:700; color:var(--journal);}
  .cal-dots{display:flex; gap:2px; position:absolute; bottom:2px; left:50%; transform:translateX(-50%);}
  .dot-btn{width:13px; height:13px; padding:0; background:none; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .dot-btn i{width:4.5px; height:4.5px; border-radius:50%; display:block;}
  .cal2w-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:12px; border:1px solid var(--border);}
  .cal2w-grid{display:grid; grid-template-columns:repeat(7, minmax(96px,1fr)); width:max-content; min-width:100%; background:var(--border); gap:1px;}
  .cal2w-dow{background:var(--surface2); text-align:center; font-size:10.5px; font-weight:700; color:var(--text-faint); padding:8px 0;}
  .cal2w-cell{background:var(--surface); min-height:108px; padding:6px 5px; position:relative; cursor:pointer;}
  .cal2w-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;}
  .cal2w-daynum{font-size:11px; font-weight:700; color:var(--text-muted);}
  .cal2w-daynum.today{background:var(--work); color:#fff; padding:1px 6px; border-radius:9px;}
  .cal2w-item{font-size:9.5px; font-weight:700; padding:2px 5px; border-radius:4px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer;}
  .cal2w-item.done{opacity:.45; text-decoration:line-through;}
  .cal2w-more{font-size:9px; color:var(--text-faint); font-weight:700; cursor:pointer;}
  .cal2w-add{background:none; border:1px dashed var(--border); border-radius:6px; width:100%; color:var(--text-faint); padding:3px 0; margin-top:2px;}
  .cal2w-add svg{width:11px; height:11px;}

  /* ---- habits ---- */
  .habitcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .habithead{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .habithead b{font-size:15px;}
  .streak{font-size:11.5px; color:var(--habit); font-weight:700;}
  .weekstrip{display:flex; justify-content:space-between;}
  .daydot-wrap{display:flex; flex-direction:column; align-items:center; gap:5px;}
  .daydot-wrap .lbl{font-size:10px; color:var(--text-faint); font-weight:700;}
  .daydot{width:30px; height:30px; border-radius:50%; border:2px solid var(--border); background:transparent;}
  .daydot.done{background:var(--habit); border-color:var(--habit);}
  .daydot.future{opacity:.3;}

  /* ---- sport ---- */
  .exercard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:10px; box-shadow:var(--shadow);}
  .exer-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .exer-name{font-weight:700; font-size:15px;}
  .exer-total{font-size:26px; font-weight:800; color:var(--sport); font-family:'Manrope';}
  .exer-total span{font-size:12px; color:var(--text-faint); font-weight:600;}
  .quickreps{display:flex; gap:6px; margin:10px 0 8px;}
  .qr-btn{background:var(--sport-dim); color:var(--sport); border:1px solid var(--sport); border-radius:20px; padding:6px 13px; font-weight:800; font-size:13px;}
  .customrep{display:flex; gap:6px;}
  .customrep input{width:70px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text);}
  .setschips{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px;}
  .setschip{background:var(--surface2); border:1px solid var(--border); border-radius:20px; padding:3px 10px; font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:5px;}
  .setschip button{background:none; border:none; color:var(--text-faint); font-size:12px; padding:0;}

  .minirow{display:flex; justify-content:space-between; align-items:flex-start; padding:10px 0; border-bottom:1px dashed var(--border);}
  .minirow:last-child{border-bottom:none;}
  .minirow .l{font-weight:700; font-size:14px;}
  .minirow .r{font-size:12px; color:var(--text-faint); margin-top:2px;}

  /* ---- journal ---- */
  .stars{display:flex; gap:6px; margin-bottom:10px;}
  .star{width:30px; height:30px; color:var(--border); background:none; border:none; padding:0; margin:0; display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .star svg{width:30px; height:30px;}
  .star.on{color:var(--journal);}
  textarea.journal-ta{width:100%; min-height:90px; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; color:var(--text); resize:vertical;}
  .journal-hist-row{padding:10px 0; border-bottom:1px dashed var(--border);}
  .journal-hist-row .jhd{display:flex; justify-content:space-between; align-items:center;}
  .journal-hist-row .jhdate{font-size:12.5px; color:var(--text-faint); font-weight:700;}
  .journal-hist-row .jhstars{color:var(--journal); font-size:12px;}
  .journal-hist-row p{margin:5px 0 0; font-size:13.5px; color:var(--text-muted);}

  /* ---- goals ---- */
  .goalrow{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--border);}
  .goalrow:last-child{border-bottom:none;}
  .goalrow .gtext{flex:1; font-size:14.5px;}
  .goalrow .gtext.done{color:var(--text-faint); text-decoration:line-through;}
  .goal-link-tag{font-size:10.5px; color:var(--goal); background:var(--goal-dim); padding:2px 7px; border-radius:10px; margin-top:4px; display:inline-block;}

  /* ---- empty state ---- */
  .empty{text-align:center; padding:26px 10px; color:var(--text-faint); font-size:13.5px;}

  /* ---- modal ---- */
  .modal-backdrop{position:fixed; inset:0; background:rgba(10,8,12,.6); z-index:50; display:flex; align-items:flex-end; opacity:0; pointer-events:none; transition:.2s; overscroll-behavior:none;}
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal-sheet{
    background:var(--surface); width:100%; max-width:min(var(--app-max), 640px); margin:0 auto; border-radius:20px 20px 0 0;
    max-height:88dvh; overflow-y:auto; padding:16px 18px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:.25s cubic-bezier(.32,.72,0,1);
    box-shadow:0 -4px 24px rgba(30,35,45,.12);
    overscroll-behavior:contain; position:relative;
  }
  .modal-backdrop.open .modal-sheet{transform:translateY(0);}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:3px; margin:0 auto 14px;}
  .modal-close{position:absolute; top:14px; right:14px; width:30px; height:30px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-muted); z-index:2;}
  .modal-close svg{width:14px; height:14px;}
  .modal-title{font-size:17px; font-weight:800; margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:6px;}
  .field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; color:var(--text);
  }
  .field textarea{min-height:70px; resize:vertical;}
  .subtask-row{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .subtask-row input[type=text]{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1; text-align:center;}

  /* ---- header extras: sync badge + settings ---- */
  .header-top-row{display:flex; align-items:center; justify-content:space-between;}
  .header-actions{display:flex; align-items:center; gap:8px;}
  .sync-badge{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-faint); font-weight:700;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--habit);}
  .sync-badge.saving .sync-dot{background:var(--work); animation:pulse 1s infinite;}
  .sync-badge.error{color:var(--danger); cursor:pointer;}
  .sync-badge.error .sync-dot{background:var(--danger);}
  @keyframes pulse{50%{opacity:.3}}
  .gearbtn{background:var(--surface); border:1px solid var(--border); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--text-muted); flex:0 0 auto;}
  .gearbtn svg{width:15px; height:15px;}

  /* ---- kanban / tasks board ---- */
  .kanban-board{display:flex; gap:10px; overflow-x:auto; padding:2px 14px 14px; margin:0 -14px; -webkit-overflow-scrolling:touch;}
  .kanban-col{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; min-width:230px; max-width:230px; flex:0 0 auto; display:flex; flex-direction:column; box-shadow:var(--shadow);}
  .kanban-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .kanban-col-head b{font-size:13.5px;}
  .kanban-col-head .kc-count{font-size:11px; color:var(--text-faint); font-weight:700;}
  .kanban-quickadd{display:flex; gap:6px; margin-bottom:10px;}
  .kanban-quickadd input{flex:1; min-width:0; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:7px 9px; color:var(--text); font-size:13px;}
  .kanban-quickadd button{background:var(--surface2); border:1px solid var(--border); border-radius:8px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--text-muted); flex:0 0 30px;}
  .kanban-cards{overflow-y:auto; max-height:60vh;}
  .kcard{background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 10px; margin-bottom:7px;}
  .kcard .kctext{font-size:13px; flex:1; word-break:normal; overflow-wrap:break-word;}
  .kcard .kctext.done{color:var(--text-faint); text-decoration:line-through;}
  .kcard .kcmeta{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
  .kanban-addcol{min-width:170px; max-width:170px; flex:0 0 auto; background:transparent; border:2px dashed var(--border); border-radius:var(--radius); color:var(--text-faint); font-size:13px; font-weight:700;}
  .kanban-col.drop-target{border-color:var(--goal); box-shadow:0 0 0 2px var(--goal-dim); background:var(--goal-dim);}
  .kanban-drop-marker{height:3px; border-radius:2px; background:var(--goal); margin:2px 0 5px;}
  .kcard-grip{cursor:grab; touch-action:none;}
  .kcard-grip svg{width:14px; height:14px;}

  /* ---- day sheet extras ---- */
  .habit-check-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px dashed var(--border);}
  .habit-check-row:last-child{border-bottom:none;}
  .habit-check-row span{flex:1; font-size:14px;}
  .journal-embed .stars{margin-bottom:8px;}
  .photo-row{display:flex; align-items:center; gap:10px; margin:10px 0;}
  .photo-btn{background:var(--surface2); border:1px dashed var(--border); border-radius:10px; width:56px; height:56px; display:flex; align-items:center; justify-content:center; color:var(--text-faint); flex:0 0 auto;}
  .photo-thumb{width:56px; height:56px; border-radius:10px; object-fit:cover; flex:0 0 auto;}
  .photo-remove{font-size:12px; color:var(--danger); background:none; border:none;}

  /* ---- settings modal ---- */
  .backup-row{display:flex; flex-direction:column; gap:10px; margin-top:6px;}
  .hint{font-size:12px; color:var(--text-faint); line-height:1.5;}

  /* ---- habit month heatmap ---- */
  .habit-stats{font-size:12px; color:var(--habit); font-weight:700; margin-bottom:8px;}
  .habit-months-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 10px; margin-top:10px;}

  /* ---- desktop layout ---- */
  .day-top-grid, .day-bottom-grid, .sport-exer-grid, .goals-grid{ display:block; }
  @media (min-width:700px){
    .day-top-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 24px; align-items:start; }
    .day-top-grid .section-title{ margin-top:6px; }
    .day-bottom-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start; }
    .sport-exer-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
    .goals-grid{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-items:start; }
    main{ padding-left:24px; padding-right:24px; }
    header.top{ padding-left:24px; padding-right:24px; }
    .kanban-board{ margin-left:-24px; margin-right:-24px; padding-left:24px; padding-right:24px; }
    .kanban-col{ flex:1 1 260px; min-width:260px; max-width:400px; }
    .kanban-addcol{ flex:0 0 220px; }
  }
  .heat-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}

  /* ---- habit table ---- */

<script>
/* ============================= HELPERS ============================= */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));
const uid = () => 'id_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
const pad2 = n => String(n).padStart(2,'0');
const isoDate = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayISO = () => isoDate(new Date());
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const monthKey = iso => iso.slice(0,7);
function mondayOf(d){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); return x; }
function weekStartISO(iso){ return isoDate(mondayOf(parseISO(iso))); }

/* ============================= LOCAL OFFLINE CACHE ============================= */
// localStorage работает только на реальной странице (не в превью артефакта Claude) — оборачиваем во всё в try/catch на всякий случай.
const LOCAL_PREFIX = 'planner-cache:';
function localSet(key, value){
  try{ localStorage.setItem(LOCAL_PREFIX+key, value); }catch(e){ /* недоступно — молча игнорируем */ }
}
function localGet(key){
  try{ return localStorage.getItem(LOCAL_PREFIX+key); }catch(e){ return null; }
}
const pendingKeys = new Set(); // ключи, у которых изменения ещё не долетели до Supabase

/* ============================= STORAGE (Supabase, офлайн-кеш, откат на Claude) ============================= */
const SUPABASE_URL = 'https://ydvpkaxwvojxcargfxns.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Mk43myXjbkzh-Sp_VFigWA_oHbRF5mg';
const OWNER_EMAIL = 'nadzen.work@gmail.com';
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, detectSessionInUrl:true } });
async function authHeaders(extra){
  const { data } = await sbClient.auth.getSession();
  const tok = data.session ? data.session.access_token : '';
  return Object.assign({ apikey: SUPABASE_KEY, Authorization: `Bearer ${tok}` }, extra||{});
}
const SB_TABLE = 'storage';
let storageMode = 'supabase'; // 'supabase' | 'claude'

async function sbGet(key){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?key=eq.${encodeURIComponent(key)}&select=value`, {
    headers: await authHeaders()
  });
  if(!res.ok) throw new Error('sb GET '+res.status);
  const rows = await res.json();
  return rows.length ? rows[0].value : null;
}
async function sbSet(key, value){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?on_conflict=key`, {
    method:'POST',
    headers: await authHeaders({ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=minimal' }),
    body: JSON.stringify([{ key, value, updated_at: new Date().toISOString() }])
  });
  if(!res.ok) throw new Error('sb SET '+res.status);
  return true;
}
async function testSupabase(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?limit=1`, { headers: await authHeaders() });
    if(!res.ok) return false;
    return true; // any real HTTP response means the network path works
  }catch(e){ return false; }
}
async function diagnoseSupabase(){
  let out = '';
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?limit=1`, { headers: await authHeaders() });
    const text = await res.text();
    out += `GET статус: ${res.status} ${res.statusText}\nОтвет: ${text.slice(0,300)}\n\n`;
  }catch(e){
    out += `GET сетевая ошибка: ${e.message}\n\n`;
  }
  try{
    const res2 = await fetch(`${SUPABASE_URL}/rest/v1/${SB_TABLE}?on_conflict=key`, {
      method:'POST',
      headers: await authHeaders({ 'Content-Type':'application/json', Prefer:'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify([{ key:'__test__', value:'ping' }])
    });
    const text2 = await res2.text();
    out += `POST (тестовая запись) статус: ${res2.status} ${res2.statusText}\nОтвет: ${text2.slice(0,300)}`;
  }catch(e){
    out += `POST сетевая ошибка: ${e.message}`;
  }
  return out;
}

async function loadKey(key, fallback){
  // 1. пробуем Supabase, если он сейчас основной режим
  if(storageMode==='supabase'){
    try{
      const value = await sbGet(key);
      if(value !== null){ localSet(key, value); return JSON.parse(value); }
    }catch(e){ /* переходим ниже */ }
  }
  // 2. пробуем хранилище Claude, если оно вообще доступно (превью в чате)
  if(typeof window.storage !== 'undefined'){
    try{
      const r = await window.storage.get(key);
      if(r){ localSet(key, r.value); return JSON.parse(r.value); }
    }catch(e){ /* переходим ниже */ }
  }
  // 3. в любом случае — локальный кеш на этом телефоне, это последний и самый надёжный рубеж
  const cached = localGet(key);
  if(cached !== null) return JSON.parse(cached);
  return fallback;
}
let syncStatus = 'saved';
function setSyncStatus(s){
  syncStatus = s;
  const badge = $('#syncBadge'); if(!badge) return;
  badge.className = 'sync-badge ' + (s==='saving' ? 'saving' : (s==='error'||s==='offline') ? 'error' : '');
  const modeTag = storageMode==='claude' ? ' · резерв' : '';
  const labels = { saving:'сохраняю…', error:'не сохранено · нажми', offline:'офлайн · сохранено на телефоне' };
  $('#syncLabel').textContent = (labels[s] || 'сохранено') + modeTag;
}
async function saveKey(key, value){
  const json = JSON.stringify(value);
  localSet(key, json); // всегда сразу пишем локально — это никогда не подведёт
  if(!navigator.onLine){
    pendingKeys.add(key);
    setSyncStatus('offline');
    return;
  }
  setSyncStatus('saving');
  let delay = 300;
  for(let attempt=0; attempt<3; attempt++){
    try{
      if(storageMode==='supabase') await sbSet(key, json);
      else if(typeof window.storage !== 'undefined'){ const r = await window.storage.set(key, json); if(!r) throw new Error('empty result'); }
      else throw new Error('no remote storage available'); // данные всё равно уже в локальном кеше выше
      pendingKeys.delete(key);
      setSyncStatus('saved'); return;
    }catch(e){
      if(attempt===2){
        pendingKeys.add(key);
        setSyncStatus(navigator.onLine ? 'error' : 'offline');
        console.error('save failed', key, e); return;
      }
      await new Promise(res=>setTimeout(res, delay)); delay*=3;
    }
  }
}
function retryAllSaves(){ persistTasks(); persistHabits(); persistSport(); persistJournal(); persistGoals(); persistSettings(); persistRetro(); }
window.addEventListener('online', async ()=>{
  if(storageMode!=='supabase'){
    const ok = await testSupabase();
    if(ok) storageMode = 'supabase';
  }
  if(pendingKeys.size) retryAllSaves();
});

const LIST_COLOR_PALETTE = [
  '#F65353','#FF8A8A','#FF9E62','#FF9F1C','#F6CC45','#AED67E','#72AA91','#5C93AA','#81B1CD','#03468F','#5C6BAA','#795CAA','#A55CAA','#FFA9BA',
  '#829D88','#355C7D','#35387D',
  '#A8C7D6','#A8AFD6','#D4A8D6','#FFD7D6'
];

  const l = state.lists.find(x=>x.id===listId);
  return l ? l.color : '#5C6BAA';
}
function newTaskOrder(){ return -Date.now(); }
function taskOrderVal(t){ return t.order!==undefined ? t.order : -(t.createdAt||0); }
function sortByOrder(arr){ return [...arr].sort((a,b)=> taskOrderVal(a)-taskOrderVal(b)); }

const state = {
  tasks: [], lists: defaultLists(),
  habits: [], habitEntries: {},
  exercises: [], sportLogs: {}, workouts: [], measurements: [],
  journal: [],
  goalsMonthly: [], goalsWeekly: [],
  otherColor: '#5C6BAA',
  retros: []
};

const persistTasks  = debounce(()=> saveKey('tasks-data',  { tasks: state.tasks, lists: state.lists }), 350);
const persistHabits  = debounce(()=> saveKey('habits-data', { habits: state.habits, habitEntries: state.habitEntries }), 350);
const persistSport   = debounce(()=> saveKey('sport-data',  { exercises: state.exercises, sportLogs: state.sportLogs, workouts: state.workouts, measurements: state.measurements }), 350);
const persistJournal = debounce(()=> saveKey('journal-data',{ journal: state.journal }), 350);
const persistGoals   = debounce(()=> saveKey('goals-data',  { goalsMonthly: state.goalsMonthly, goalsWeekly: state.goalsWeekly }), 350);
const persistSettings = debounce(()=> saveKey('settings-data', { otherColor: state.otherColor }), 350);
const persistRetro = debounce(()=> saveKey('retro-data', { retros: state.retros }), 350);

function normalizeTasksAndLists(){
  // ensure every task has a list field (older tasks predating lists) + defaults for newer fields
  state.tasks.forEach(task => {
    if(!task.list) task.list = task.type || 'inbox';
    if(task.recur === undefined) task.recur = null;
    if(task.carryCount === undefined) task.carryCount = 0;
    if(task.order === undefined) task.order = -(task.createdAt||Date.now());
    (task.subtasks||[]).forEach(s => { if(s.date===undefined) s.date=null; if(!s.tags) s.tags=[]; });
  });
  // ensure every list has a color; one-time migration from the old default palette to the new one
  const defaults = defaultLists();
  const OLD_DEFAULTS = { inbox:'#9077BB', work:'#D68A3A', home:'#CD7C60' };
  state.lists.forEach((l,i) => {
    const def = defaults.find(d=>d.id===l.id);
    if(def && (!l.color || l.color === OLD_DEFAULTS[l.id])) l.color = def.color;
    else if(!l.color) l.color = LIST_COLOR_PALETTE[i % LIST_COLOR_PALETTE.length];
  });
}
function normalizeHabits(){
  state.habits.forEach((hb,i) => {
    if(!hb.color) hb.color = LIST_COLOR_PALETTE[i % LIST_COLOR_PALETTE.length];
    if(hb.archived===undefined) hb.archived = false;
  });
}
async function loadAll(){
  const [t, h, s, j, g, st, rt] = await Promise.all([
    loadKey('tasks-data', null),
    loadKey('habits-data', null),
    loadKey('sport-data', null),
    loadKey('journal-data', null),
    loadKey('goals-data', null),
    loadKey('settings-data', null),
    loadKey('retro-data', null),
  ]);
  if(t){
    state.tasks = t.tasks || [];
    state.lists = t.lists || defaultLists();
    // migrate legacy inbox format (pre-lists version)
    if(t.inbox){
      ['work','home'].forEach(k => (t.inbox[k]||[]).forEach(item => {
        state.tasks.push({ id:item.id||uid(), type:k, list:'inbox', text:item.text, date:null, tags:[], subtasks:[], done:false, createdAt:item.createdAt||Date.now() });
      }));
    }
    normalizeTasksAndLists();
  }
  if(h){
    state.habits=h.habits||[]; state.habitEntries=h.habitEntries||{};
    normalizeHabits();
  }
  if(s){ state.exercises=s.exercises||[]; state.sportLogs=s.sportLogs||{}; state.workouts=s.workouts||[]; state.measurements=s.measurements||[]; }
  if(j){ state.journal=j.journal||[]; }
  if(g){ state.goalsMonthly=g.goalsMonthly||[]; state.goalsWeekly=g.goalsWeekly||[]; }
  if(st && st.otherColor){ state.otherColor = st.otherColor; }
  if(rt){ state.retros = rt.retros || []; state.retros.forEach(r => { if(r.highlight===undefined) r.highlight=''; }); }
}

function renderNav(){
  const wrap = $('#navwrap');
  wrap.innerHTML = TABS.map(t => `
    <button class="navbtn ${activeTab===t.id?'active':''}" data-tab="${t.id}">
      ${icon(t.icon)}
      <span>${t.label}</span>
    </button>`).join('');
  $$('.navbtn', wrap).forEach(b => b.addEventListener('click', ()=> switchTab(b.dataset.tab)));
}
function switchTab(id){
  activeTab = id;
  $$('.tabpanel').forEach(p => p.classList.remove('active'));
  $('#tab-'+id).classList.add('active');
  $$('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab===id));
  $('#headerTitle').textContent = TABS.find(t=>t.id===id).title;
  renderActive();
}
function renderActive(){
  ({ day: renderDay, tasks: renderTasks, calendar: renderCalendar, habits: renderHabits,
     sport: renderSport, goals: renderGoals, retro: renderRetro })[activeTab]();

function openModal(html, onMount){
  $('#modalSheet').innerHTML = `<button class="modal-close" id="modalCloseBtn">${icon('x')}</button><div class="modal-handle"></div>${html}`;
  $('#modalBackdrop').classList.add('open');

/* ---- Task modal (create/edit) ---- */
function openTaskModal({ type, date, list, task=null }){
  const draft = task ? JSON.parse(JSON.stringify(task)) : {
    id: uid(), type: type||null, list: list || type || 'inbox', text:'', date: date || null, tags:[], subtasks:[], done:false, createdAt: Date.now(), recur: null, carryCount:0, order: newTaskOrder()
  };
  if(draft.recur === undefined) draft.recur = null;
  const accent = getListColor(draft.list);
  const html = `
    <div class="modal-title">${task ? 'Задача' : 'Новая задача'}</div>
    <div class="field"><label>Текст</label><input type="text" id="mf-text" value="${escapeHtml(draft.text)}" placeholder="Что нужно сделать"></div>
    <div class="field"><label>Список</label>
      <select id="mf-list">
        ${state.lists.map(l=>`<option value="${l.id}" ${draft.list===l.id?'selected':''}>${escapeHtml(l.name)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Дата (необязательно)</label><input type="date" id="mf-date" value="${draft.date||''}"></div>
    <div class="field"><label>Теги (через запятую)</label><input type="text" id="mf-tags" value="${draft.tags.join(', ')}" placeholder="напр. CaseGuru, срочно"></div>
    <div class="field">
      <label>Повтор</label>
      <div class="row-gap">
        <select id="mf-recur-freq" style="flex:1">
          <option value="">Не повторять</option>
          <option value="daily" ${draft.recur&&draft.recur.freq==='daily'?'selected':''}>По дням</option>
          <option value="weekly" ${draft.recur&&draft.recur.freq==='weekly'?'selected':''}>По неделям</option>
          <option value="monthly" ${draft.recur&&draft.recur.freq==='monthly'?'selected':''}>По месяцам</option>
        </select>
        <input type="number" id="mf-recur-interval" min="1" value="${draft.recur?draft.recur.interval:1}" style="width:64px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:8px; color:var(--text);">
      </div>
      <p class="hint">Например «По неделям» + 2 = раз в две недели. При отметке «выполнено» дата новой задачи проставится автоматически.</p>
    </div>
    <div class="field">
      <label>Подзадачи (можно с датой и тегами)</label>
      <div id="mf-subtasks"></div>
      <div class="quickadd"><input type="text" id="mf-sub-input" placeholder="Добавить подзадачу"><button id="mf-sub-add" type="button">${icon('plus')}</button></div>
    </div>
    <div class="modal-actions">
      ${task ? `<button class="btn" id="mf-delete" style="color:var(--danger)">Удалить</button>` : ''}
      <button class="btn btn-primary" id="mf-save" style="background:${accent}">Сохранить</button>
    </div>
  `;
  openModal(html, root => {
    const renderSubs = () => {
      $('#mf-subtasks', root).innerHTML = draft.subtasks.map(s => `
        <div class="subtask-row" data-id="${s.id}" style="flex-wrap:wrap; align-items:center;">
          <button class="checkbox ${s.done?'done '+draft.type:''}" data-sub-toggle="${s.id}">${icon('check')}</button>
          <input type="text" value="${escapeHtml(s.text)}" data-sub-text="${s.id}" style="flex:1; min-width:100px;">
          <button class="delbtn" data-sub-del="${s.id}">${icon('x')}</button>
          <input type="date" value="${s.date||''}" data-sub-date="${s.id}" style="width:132px; margin-left:28px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:5px 8px; color:var(--text); font-size:12.5px;">
          <input type="text" value="${(s.tags||[]).join(', ')}" data-sub-tags="${s.id}" placeholder="теги" style="flex:1; min-width:80px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:5px 8px; color:var(--text); font-size:12.5px;">
        </div>`).join('');
      $$('[data-sub-toggle]', root).forEach(b => b.addEventListener('click', ()=>{
        const st = draft.subtasks.find(s=>s.id===b.dataset.subToggle); st.done=!st.done; renderSubs();
      }));
      $$('[data-sub-text]', root).forEach(inp => inp.addEventListener('input', ()=>{
        draft.subtasks.find(s=>s.id===inp.dataset.subText).text = inp.value;
      }));
      $$('[data-sub-date]', root).forEach(inp => inp.addEventListener('change', ()=>{
        draft.subtasks.find(s=>s.id===inp.dataset.subDate).date = inp.value || null;
      }));
      $$('[data-sub-tags]', root).forEach(inp => inp.addEventListener('input', ()=>{
        draft.subtasks.find(s=>s.id===inp.dataset.subTags).tags = inp.value.split(',').map(x=>x.trim()).filter(Boolean);
      }));
      $$('[data-sub-del]', root).forEach(b => b.addEventListener('click', ()=>{
        draft.subtasks = draft.subtasks.filter(s=>s.id!==b.dataset.subDel); renderSubs();
      }));
    };
    renderSubs();
    $('#mf-sub-add', root).addEventListener('click', ()=>{
      const inp = $('#mf-sub-input', root);
      if(!inp.value.trim()) return;
      draft.subtasks.push({ id: uid(), text: inp.value.trim(), done:false, date:null, tags:[] });
      inp.value=''; renderSubs();
    });
    $('#mf-save', root).addEventListener('click', ()=>{
      draft.text = $('#mf-text', root).value.trim();
      if(!draft.text) return;
      draft.list = $('#mf-list', root).value;
      draft.type = (draft.list==='work'||draft.list==='home') ? draft.list : null;
      draft.date = $('#mf-date', root).value || null;
      draft.tags = $('#mf-tags', root).value.split(',').map(s=>s.trim()).filter(Boolean);
      const freq = $('#mf-recur-freq', root).value;
      draft.recur = freq ? { freq, interval: Math.max(1, Number($('#mf-recur-interval', root).value)||1) } : null;
      const idx = state.tasks.findIndex(t=>t.id===draft.id);
      if(idx>=0) state.tasks[idx]=draft; else state.tasks.push(draft);
      persistTasks(); closeModal(); renderActive();
    });
    if(task){
      $('#mf-delete', root).addEventListener('click', ()=>{
        if(!confirm(`Удалить задачу «${draft.text}»?`)) return;
        state.tasks = state.tasks.filter(t=>t.id!==draft.id);
        persistTasks(); closeModal(); renderActive();
      });
    }
  });
}
function nextRecurDate(iso, recur){
  const d = parseISO(iso||todayISO());
  if(recur.freq==='daily') d.setDate(d.getDate()+recur.interval);
  else if(recur.freq==='weekly') d.setDate(d.getDate()+7*recur.interval);
  else if(recur.freq==='monthly') d.setMonth(d.getMonth()+recur.interval);
  return isoDate(d);
}
function toggleTaskDone(tsk){
  tsk.done = !tsk.done;
  if(tsk.done && tsk.recur){
    const clone = JSON.parse(JSON.stringify(tsk));
    clone.id = uid();
    clone.done = false;
    clone.date = nextRecurDate(tsk.date, tsk.recur);
    clone.createdAt = Date.now();
    const deltaMs = tsk.date ? (parseISO(clone.date) - parseISO(tsk.date)) : 0;
    clone.subtasks = (clone.subtasks||[]).map(s => ({
      ...s,
      id: uid(),
      done: false,
      date: s.date ? isoDate(new Date(parseISO(s.date).getTime()+deltaMs)) : null
    }));
    clone.carryCount = 0;
    clone.order = newTaskOrder();
    state.tasks.push(clone);
  }
}
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================= TASK ROW RENDER ============================= */
function taskRowHTML(t, opts={}){
  const subDone = t.subtasks.filter(s=>s.done).length;
  const accent = getListColor(t.list);
  return `
  <div class="taskrow">
    <button class="checkbox ${t.done?'done':''}" style="${t.done?`background:${accent}; border-color:${accent}; color:#fff;`:''}" data-toggle="${t.id}">${icon('check')}</button>
    <div class="taskbody" data-open="${t.id}">
      <div class="tasktext ${t.done?'done':''}">${escapeHtml(t.text)}</div>
      <div class="taskmeta">
        ${t.tags.map(tag=>`<span class="chip">${escapeHtml(tag)}</span>`).join('')}
        ${t.subtasks.length ? `<span class="chip sub">${subDone}/${t.subtasks.length} подзадач</span>` : ''}
      </div>
    </div>
    ${opts.reorder ? `
      <div style="display:flex; flex-direction:column; gap:1px;">
        <button class="reorder-btn" data-moveup="${t.id}" data-bucket="${opts.bucket}" ${opts.isFirst?'disabled':''}>${icon('chevUp')}</button>
        <button class="reorder-btn" data-movedown="${t.id}" data-bucket="${opts.bucket}" ${opts.isLast?'disabled':''}>${icon('chevDown')}</button>
      </div>
    ` : ''}
    <button class="delbtn" data-del="${t.id}">${icon('x')}</button>
  </div>`;
}
function bindTaskRowEvents(root){
  $$('[data-toggle]', root).forEach(b => b.addEventListener('click', ()=>{
    const t = state.tasks.find(x=>x.id===b.dataset.toggle); toggleTaskDone(t); persistTasks(); renderActive();
  }));
  $$('[data-open]', root).forEach(el => el.addEventListener('click', ()=>{
    const t = state.tasks.find(x=>x.id===el.dataset.open); openTaskModal({ type:t.type, task:t });
  }));
  $$('[data-del]', root).forEach(b => b.addEventListener('click', ()=>{
    const tsk = state.tasks.find(x=>x.id===b.dataset.del);
    if(!confirm(`Удалить задачу «${tsk.text}»?`)) return;
    state.tasks = state.tasks.filter(x=>x.id!==b.dataset.del); persistTasks(); renderActive();
  }));
}
function subtaskRowHTML(parent, s){
  const accent = getListColor(parent.list);
  return `
  <div class="taskrow">
    <button class="checkbox ${s.done?'done':''}" style="${s.done?`background:${accent}; border-color:${accent}; color:#fff;`:''}" data-subdaytoggle="${s.id}" data-subparent="${parent.id}">${icon('check')}</button>
    <div class="taskbody" data-subdayopen="${parent.id}">
      <div class="tasktext ${s.done?'done':''}">${escapeHtml(s.text)}</div>
      <div class="taskmeta">
        <span class="chip sub">↳ ${escapeHtml(parent.text)}</span>
        ${(s.tags||[]).map(tag=>`<span class="chip">${escapeHtml(tag)}</span>`).join('')}
      </div>
    </div>
  </div>`;
}
function bindSubtaskRowEvents(root){
  $$('[data-subdaytoggle]', root).forEach(b => b.addEventListener('click', ()=>{
    const parent = state.tasks.find(x=>x.id===b.dataset.subparent);
    const sub = parent.subtasks.find(s=>s.id===b.dataset.subdaytoggle);
    sub.done = !sub.done; persistTasks(); renderActive();
  }));
  $$('[data-subdayopen]', root).forEach(el => el.addEventListener('click', ()=>{
    const parent = state.tasks.find(x=>x.id===el.dataset.subdayopen);
    openTaskModal({ task: parent });
  }));
}

/* ============================= DAY TAB (единый лист) ============================= */
function renderDay(){
  const t = todayISO();
  // переносим незавершённые задачи с прошлых дней на сегодня — Работа/Дом/Другое, без исключений
  let moved = false;
  state.tasks.forEach(x => {
    if(x.date && x.date < t && !x.done){
      x.date = t;
      x.carryCount = (x.carryCount||0) + 1;
      moved = true;
    }
    (x.subtasks||[]).forEach(s => {
      if(s.date && s.date < t && !s.done){ s.date = t; moved = true; }
    });
  });
  if(moved) persistTasks();

  const work = sortByOrder(state.tasks.filter(x=>x.type==='work' && x.date===t));
  const home = sortByOrder(state.tasks.filter(x=>x.type==='home' && x.date===t));
  const other = sortByOrder(state.tasks.filter(x=>x.type===null && x.date===t));
  const subToday = [];
  state.tasks.forEach(pt => (pt.subtasks||[]).forEach(s => { if(s.date===t) subToday.push({ parent: pt, sub: s }); }));
  const subWork = subToday.filter(x=>x.parent.type==='work');
  const subHome = subToday.filter(x=>x.parent.type==='home');
  const subOther = subToday.filter(x=>x.parent.type===null);
  const entry = state.journal.find(j=>j.date===t);

  const html = `
    <div class="day-top-grid">
      <div>
        <div class="section-title" style="margin-top:6px">
          <h2><span class="accent-dot" style="background:${getListColor('work')}"></span>Работа</h2>
          <span class="count">${work.length + subWork.length}</span>
        </div>
        <div class="slotlist" id="workSlots"></div>
      </div>

      <div>
        <div class="section-title" style="margin-top:6px">
          <h2><span class="accent-dot" style="background:${getListColor('home')}"></span>Дом</h2>
          <span class="count">${home.length + subHome.length}</span>
        </div>
        <div class="slotlist" id="homeSlots"></div>
      </div>

      <div>
        <div class="section-title" style="margin-top:6px">
          <h2>
            <input type="color" id="otherColorPicker" value="${state.otherColor}" style="width:11px; height:11px; padding:0; border:none; border-radius:50%; margin-right:7px; vertical-align:middle; cursor:pointer;">
            Другое
          </h2>
          <span class="count">${other.length + subOther.length}</span>
        </div>
        <div class="slotlist" id="otherSlots"></div>
      </div>
    </div>

    <div class="quickadd" style="margin-top:6px;">
      <input type="text" id="dayInboxInput" placeholder="Мысль на бегу → во «Входящие»">
      <button id="dayInboxAdd">${icon('plus')}</button>
    </div>

    <div class="day-bottom-grid">
      <div>
        <div class="section-title"><h2><span class="accent-dot" style="background:var(--habit)"></span>Привычки сегодня</h2></div>
        <div class="card" id="dayHabits"></div>
      </div>

      <div>
        <div class="section-title"><h2><span class="accent-dot" style="background:var(--journal)"></span>Дневник</h2></div>
        <div class="card journal-embed">
          <div class="stars" id="starsToday"></div>
          <div class="photo-row" id="photoRow"></div>
          <textarea class="journal-ta" id="journalTa" placeholder="Как прошёл день?">${entry?escapeHtml(entry.text):''}</textarea>
          <button class="btn btn-primary" id="journalSave" style="background:var(--journal); color:#1E1A22; margin-top:10px; width:100%;">Сохранить</button>
        </div>
      </div>
    </div>
  `;
  $('#tab-day').innerHTML = html;

  const workEl = $('#workSlots'), homeEl = $('#homeSlots'), otherEl = $('#otherSlots');
  const rowHtml = (arr, bucket) => arr.map((tsk,i) => taskRowHTML(tsk, { reorder:true, bucket, isFirst:i===0, isLast:i===arr.length-1 })).join('');
  workEl.innerHTML = rowHtml(work,'work') + subWork.map(x=>subtaskRowHTML(x.parent,x.sub)).join('') + `<button class="addslot" data-addtask="work"><span class="plusring">+</span>Добавить рабочую задачу</button>`;
  homeEl.innerHTML = rowHtml(home,'home') + subHome.map(x=>subtaskRowHTML(x.parent,x.sub)).join('') + `<button class="addslot" data-addtask="home"><span class="plusring">+</span>Добавить домашнее дело</button>`;
  otherEl.innerHTML = rowHtml(other,'other') + subOther.map(x=>subtaskRowHTML(x.parent,x.sub)).join('') + `<button class="addslot" data-addother="1"><span class="plusring">+</span>Добавить задачу из другого списка</button>`;
  bindTaskRowEvents(workEl); bindTaskRowEvents(homeEl); bindTaskRowEvents(otherEl);
  bindSubtaskRowEvents(workEl); bindSubtaskRowEvents(homeEl); bindSubtaskRowEvents(otherEl);
  const buckets = { work, home, other };
  function bindReorder(root){
    $$('[data-moveup]', root).forEach(b => b.addEventListener('click', ()=>{
      const arr = buckets[b.dataset.bucket];
      const i = arr.findIndex(x=>x.id===b.dataset.moveup);
      if(i>0){ const tmp=arr[i].order; arr[i].order=arr[i-1].order; arr[i-1].order=tmp; persistTasks(); renderDay(); }
    }));
    $$('[data-movedown]', root).forEach(b => b.addEventListener('click', ()=>{
      const arr = buckets[b.dataset.bucket];
      const i = arr.findIndex(x=>x.id===b.dataset.movedown);
      if(i<arr.length-1){ const tmp=arr[i].order; arr[i].order=arr[i+1].order; arr[i+1].order=tmp; persistTasks(); renderDay(); }
    }));
  }
  bindReorder(workEl); bindReorder(homeEl); bindReorder(otherEl);
  $$('[data-addtask]').forEach(b => b.addEventListener('click', ()=> openTaskModal({ type:b.dataset.addtask, list:b.dataset.addtask, date:t })));
  $('[data-addother]').addEventListener('click', ()=> openTaskModal({ date:t }));

  $('#otherColorPicker').addEventListener('change', e => {
    state.otherColor = e.target.value; persistSettings(); renderDay();
  });

  $('#dayInboxAdd').addEventListener('click', addDayInboxItem);
  $('#dayInboxInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addDayInboxItem(); });

  const habEl = $('#dayHabits');

function compressImage(file, maxW=640, quality=0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w=img.width, h=img.height;
        if(w>maxW){ h = Math.round(h*maxW/w); w = maxW; }
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getDropIndex(col, clientY){
  const container = col.querySelector('.kanban-active-cards');
  if(!container) return 0;
  const cards = Array.from(container.querySelectorAll(':scope > .kcard'));
  for(let i=0;i<cards.length;i++){
    const r = cards[i].getBoundingClientRect();
    if(clientY < r.top + r.height/2) return i;
  }
  return cards.length;
}
function showDropMarker(col, index){
  document.querySelectorAll('.kanban-drop-marker').forEach(m=>m.remove());
  const container = col.querySelector('.kanban-active-cards');
  if(!container) return;
  const marker = document.createElement('div');
  marker.className = 'kanban-drop-marker';
  const cards = Array.from(container.querySelectorAll(':scope > .kcard'));
  if(index>=cards.length) container.appendChild(marker);
  else container.insertBefore(marker, cards[index]);
}
function commitDrop(tsk, targetListId, dropIndex){
  const siblings = sortByOrder(state.tasks.filter(x=>x.list===targetListId && !x.done && x.id!==tsk.id));
  siblings.splice(Math.max(0, Math.min(dropIndex, siblings.length)), 0, tsk);
  siblings.forEach((item,i) => { item.order = i; });
  tsk.list = targetListId;
  tsk.type = (targetListId==='work'||targetListId==='home') ? targetListId : null;
  persistTasks();
}
function attachDragHandlers(board){
  $$('[data-grip]', board).forEach(handle => {
    handle.addEventListener('pointerdown', e => {
      if(e.pointerType==='mouse' && e.button!==0) return;
      e.preventDefault();
      const taskId = handle.dataset.grip;
      const tsk = state.tasks.find(x=>x.id===taskId);
      const cardEl = handle.closest('.kcard');
      const rect = cardEl.getBoundingClientRect();
      const ghost = cardEl.cloneNode(true);
      Object.assign(ghost.style, {
        position:'fixed', top:rect.top+'px', left:rect.left+'px', width:rect.width+'px',
        pointerEvents:'none', opacity:'0.9', zIndex:999, boxShadow:'0 10px 28px rgba(0,0,0,.3)', transform:'rotate(1.5deg)'
      });
      document.body.appendChild(ghost);
      cardEl.style.opacity = '0.3';
      const offsetX = e.clientX-rect.left, offsetY = e.clientY-rect.top;
      try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      let lastCol = null, lastIndex = null;
      const onMove = ev => {
        ghost.style.left = (ev.clientX-offsetX)+'px';
        ghost.style.top = (ev.clientY-offsetY)+'px';
        $$('.kanban-col', board).forEach(c=>c.classList.remove('drop-target'));
        const col = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('.kanban-col');
        if(col){
          col.classList.add('drop-target');
          const idx = getDropIndex(col, ev.clientY);
          showDropMarker(col, idx);
          lastCol = col; lastIndex = idx;
        } else {
          document.querySelectorAll('.kanban-drop-marker').forEach(m=>m.remove());
          lastCol = null;
        }
      };
      const onUp = ev => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        ghost.remove();
        cardEl.style.opacity = '';
        $$('.kanban-col', board).forEach(c=>c.classList.remove('drop-target'));
        document.querySelectorAll('.kanban-drop-marker').forEach(m=>m.remove());
        if(lastCol){
          const targetListId = lastCol.dataset.listid;
          commitDrop(tsk, targetListId, lastIndex);
        }
        renderTasks();
      };
      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onUp);
    });
  });
}

function buildActivityRings(rings, size=180, strokeW=14){
  const cx = size/2, cy = size/2;
  const circles = rings.map(r => {
    const circ = 2*Math.PI*r.radius;
    const dash = Math.max(0, Math.min(1, r.pct/100)) * circ;
    return `
      <circle cx="${cx}" cy="${cy}" r="${r.radius}" fill="none" stroke="${r.color}" stroke-width="${strokeW}" opacity="0.18"></circle>
      ${dash>0 ? `<circle cx="${cx}" cy="${cy}" r="${r.radius}" fill="none" stroke="${r.color}" stroke-width="${strokeW}"
        stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
        transform="rotate(-90 ${cx} ${cy})"></circle>` : ''}
    `;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px; display:block; margin:0 auto;">${circles}</svg>`;
}
function dayRingsHTML(iso, workPct, homePct, otherPct){

  ], size, sw);
}

function shiftMonth(key, delta){

  return `${y}-${pad2(m)}`;
}

function habitStreak(h){
  let streak=0, d=new Date();
  while(true){
    const iso = isoDate(d);
    if(state.habitEntries[`${h.id}_${iso}`]){ streak++; d.setDate(d.getDate()-1); }
    else if(iso===todayISO()){ d.setDate(d.getDate()-1); continue; }
    else break;
  }
  return streak;
}

  for(let d=1; d<=daysInMonth; d++) cells.push({ day:d, faded:false, iso: `${y}-${pad2(m)}-${pad2(d)}` });
  while(cells.length % 7 !== 0) cells.push({ day: cells.length, faded:true });

function habitDashboardStats(h){
  const t = todayISO();
  const start = h.createdAt ? isoDate(new Date(h.createdAt)) : t;
  const end = h.archived ? (h.archivedAt || t) : t;
  if(parseISO(start) > parseISO(end)) return { elapsed:0, done:0, pct:0, start, end };
  let elapsed=0, done=0;
  const endD = parseISO(end);
  for(let d=parseISO(start); d<=endD; d.setDate(d.getDate()+1)){
    elapsed++;
    if(state.habitEntries[`${h.id}_${isoDate(d)}`]) done++;
  }
  return { elapsed, done, pct: elapsed?Math.round(done/elapsed*100):0, start, end };
}
function habitLongestStreak(h){
  const t = todayISO();
  const start = h.createdAt ? isoDate(new Date(h.createdAt)) : t;
  const end = h.archived ? (h.archivedAt || t) : t;
  if(parseISO(start) > parseISO(end)) return 0;
  let longest=0, current=0;
  const endD = parseISO(end);
  for(let d=parseISO(start); d<=endD; d.setDate(d.getDate()+1)){
    if(state.habitEntries[`${h.id}_${isoDate(d)}`]){ current++; longest=Math.max(longest,current); }
    else current=0;
  }
  return longest;
}
function habitCurrentGap(h){
  // сколько дней подряд НЕ выполнялось, считая от сегодня назад (только для активных)
  if(h.archived) return 0;
  const start = h.createdAt ? isoDate(new Date(h.createdAt)) : todayISO();
  let d = new Date();
  let gap = 0;
  while(isoDate(d) >= start){
    if(state.habitEntries[`${h.id}_${isoDate(d)}`]) return gap;
    gap++;
    d.setDate(d.getDate()-1);
  }
  return gap;
}
function habitWeeklyBuckets(h, weeks=8){
  const t = todayISO();
  const start = h.createdAt ? isoDate(new Date(h.createdAt)) : t;
  const end = h.archived ? (h.archivedAt || t) : t;
  const endMonday = mondayOf(parseISO(end));
  const buckets = [];
  for(let w=weeks-1; w>=0; w--){
    const wkStart = new Date(endMonday); wkStart.setDate(wkStart.getDate()-7*w);
    const wkEnd = new Date(wkStart); wkEnd.setDate(wkStart.getDate()+6);
    let elapsed=0, done=0;
    for(let d=new Date(wkStart); d<=wkEnd; d.setDate(d.getDate()+1)){
      const iso = isoDate(d);
      if(iso<start || iso>end) continue;
      elapsed++;
      if(state.habitEntries[`${h.id}_${iso}`]) done++;
    }
    buckets.push({ pct: elapsed ? Math.round(done/elapsed*100) : null, elapsed });
  }
  return buckets;
}
function weeklyChartHTML(h, buckets){
  return `
    <div style="display:flex; align-items:flex-end; gap:3px; height:34px; margin:8px 0 4px;">
      ${buckets.map(b => {
        const h_px = b.elapsed ? Math.max(3, Math.round(b.pct*0.34)) : 2;
        return `<div style="flex:1; height:${h_px}px; background:${b.elapsed?h.color:'var(--border)'}; opacity:${b.elapsed?1:0.4}; border-radius:2px;"></div>`;
      }).join('')}
    </div>
    <div class="hint" style="margin-bottom:8px;">Динамика по неделям (последние ${buckets.length})</div>
  `;
}
function openHabitsStats(){
  if(!state.habits.length){
    openModal(`<div class="modal-title">Статистика привычек</div><div class="empty">Пока нет ни одной привычки</div>`, ()=>{});
    return;
  }
  const sorted = [...state.habits].sort((a,b)=> (a.archived===b.archived) ? 0 : (a.archived?1:-1));
  const html = `
    <div class="modal-title">Статистика привычек</div>
    ${sorted.map(h => {
      const s = habitDashboardStats(h);
      const longest = habitLongestStreak(h);
      const gap = habitCurrentGap(h);
      const buckets = habitWeeklyBuckets(h);
      const rangeLabel = h.archived ? `${fmtHuman(s.start)} — ${fmtHuman(s.end)}` : `с ${fmtHuman(s.start)} по сегодня`;
      const badges = [7,30,100].filter(n=>longest>=n);
      return `
      <div class="card" style="padding:14px 16px; margin-bottom:10px; ${h.archived?'opacity:.7;':''}">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-weight:800; font-size:14.5px;"><span class="accent-dot" style="background:${h.color}"></span>${escapeHtml(h.name)}${h.archived?' <span class="hint" style="margin:0;">· завершена</span>':''}</span>
          <span style="font-size:18px; font-weight:800; font-family:'Manrope'; color:${h.color};">${s.pct}%</span>
        </div>
        <div class="hint" style="margin-bottom:8px;">${rangeLabel}${!h.archived?` · 🔥 ${habitStreak(h)}`:''}</div>
        <div style="height:7px; border-radius:4px; background:var(--surface2); overflow:hidden; margin-bottom:6px;">
          <div style="height:100%; width:${s.pct}%; background:${h.color};"></div>
        </div>
        <div class="hint" style="margin-bottom:2px;">${s.done} выполнено из ${s.elapsed} дней</div>
        ${!h.archived ? `<div class="hint" style="color:${gap>=3?'var(--danger)':'var(--text-faint)'}; margin-bottom:2px;">${gap===0?'Выполнено сегодня ✓':`Не выполнялось: ${gap} ${gap===1?'день':gap<5?'дня':'дней'} подряд`}</div>` : ''}
        ${weeklyChartHTML(h, buckets)}
        ${badges.length ? `<div class="row-gap">${badges.map(n=>`<span class="chip">🏅 ${n} дней</span>`).join('')}</div>` : ''}
      </div>`;
    }).join('')}
  `;
  openModal(html, ()=>{});
}

    }
    draw();
  });
}

function buildMeasurementChart(points, metricKey, unit, color){
  const w = 320, h = 100, padL = 34, padB = 16, padT = 10;
  const values = points.map(p=>p[metricKey]);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || 1;
  const innerW = w-padL-8, innerH = h-padT-padB;
  const stepX = points.length>1 ? innerW/(points.length-1) : 0;
  const coords = points.map((p,i) => ({
    x: padL + i*stepX,
    y: padT + innerH - ((p[metricKey]-min)/range)*innerH
  }));
  const pathD = coords.map((c,i)=> (i===0?'M':'L')+c.x.toFixed(1)+','+c.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${coords[coords.length-1].x.toFixed(1)},${padT+innerH} L${coords[0].x.toFixed(1)},${padT+innerH} Z`;
  const dots = coords.map((c,i)=>`<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="3" fill="${color}"></circle>`).join('');
  const first = points[0], last = points[points.length-1];
  const diff = (last[metricKey]-first[metricKey]).toFixed(1);
  return `
    <div style="display:flex; justify-content:flex-end; align-items:baseline; margin-bottom:6px;">
      <span style="font-size:12px; font-weight:800; color:${diff<0?'var(--habit)':diff>0?'var(--danger)':'var(--text-faint)'};">${last[metricKey]}${unit} (${diff>0?'+':''}${diff})</span>
    </div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:${h}px; display:block;">
      <text x="2" y="${padT+5}" font-size="8" fill="var(--text-faint)">${max}</text>
      <text x="2" y="${padT+innerH}" font-size="8" fill="var(--text-faint)">${min}</text>
      <line x1="${padL}" y1="${padT+innerH}" x2="${w-4}" y2="${padT+innerH}" stroke="var(--border)" stroke-width="1"/>
      <path d="${areaD}" fill="${color}" opacity="0.12"></path>
      <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2"></path>
      ${dots}
    </svg>
    <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--text-faint); margin-top:2px;">
      <span>${fmtHuman(first.date)}</span>
      <span>${fmtHuman(last.date)}</span>
    </div>
  `;
}

function exportBackup(){
  const snapshot = {
    tasks: state.tasks, lists: state.lists,
    habits: state.habits, habitEntries: state.habitEntries,
    exercises: state.exercises, sportLogs: state.sportLogs, workouts: state.workouts, measurements: state.measurements,
    journal: state.journal,

    retros: state.retros, otherColor: state.otherColor,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `life-hub-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);

function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const data = JSON.parse(ev.target.result);
      if(!confirm('Заменить текущие данные содержимым файла?')) return;
      state.tasks = data.tasks || []; state.lists = data.lists || defaultLists();
      state.habits = data.habits || []; state.habitEntries = data.habitEntries || {};
      state.exercises = data.exercises || []; state.sportLogs = data.sportLogs || {};
      state.workouts = data.workouts || []; state.measurements = data.measurements || [];
      state.journal = data.journal || [];
      state.goalsMonthly = data.goalsMonthly || []; state.goalsWeekly = data.goalsWeekly || [];
      state.retros = data.retros || []; state.otherColor = data.otherColor || state.otherColor;
      normalizeTasksAndLists(); normalizeHabits();
      persistTasks(); persistHabits(); persistSport(); persistJournal(); persistGoals(); persistRetro(); persistSettings();
      closeModal(); renderActive();
    }catch(err){ alert('Не удалось прочитать файл — проверь, что это тот самый экспортированный JSON.'); }
  };
  reader.readAsText(file);
}

/* ============================= GOALS TAB ============================= */
function weekLabel(startIso){
  const start = parseISO(startIso); const end = new Date(start); end.setDate(start.getDate()+6);
  return `${start.getDate()} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
}
/* ============================= RETRO TAB ============================= */
function periodRange(mode, cursor){
  if(mode==='week'){
    const d = parseISO(cursor); const end = new Date(d); end.setDate(d.getDate()+6);
    return { start: cursor, end: isoDate(end) };
  }
  const [y,m] = cursor.split('-').map(Number);
  return { start: `${y}-${pad2(m)}-01`, end: `${y}-${pad2(m)}-${pad2(new Date(y,m,0).getDate())}` };
}
function retroPeriodLabel(mode, cursor){
  if(mode==='week') return weekLabel(cursor);
  const [y,m] = cursor.split('-').map(Number);
  return `${MONTHS_NOM[m-1]} ${y}`;
}
function tasksStatsForRange(start,end){
  const tasks = state.tasks.filter(t=>t.date && t.date>=start && t.date<=end);
  const pick = cat => tasks.filter(t => cat==='other' ? t.type===null : t.type===cat);
  const work = pick('work'), home = pick('home'), other = pick('other');
  const pct = arr => arr.length ? Math.round(arr.filter(x=>x.done).length/arr.length*100) : 0;
  const shape = arr => ({ total:arr.length, done:arr.filter(x=>x.done).length, pct:pct(arr) });
  return { total: tasks.length, done: tasks.filter(t=>t.done).length, work:shape(work), home:shape(home), other:shape(other) };
}
function habitsStatsForRange(start,end){
  const results = state.habits.map(h => {
    const hs = h.createdAt ? isoDate(new Date(h.createdAt)) : start;
    const he = h.archived ? (h.archivedAt||end) : end;
    const rs = hs > start ? hs : start;
    const re = he < end ? he : end;
    if(parseISO(rs) > parseISO(re)) return null;
    let elapsed=0, done=0;
    for(let d=parseISO(rs); d<=parseISO(re); d.setDate(d.getDate()+1)){
      elapsed++; if(state.habitEntries[`${h.id}_${isoDate(d)}`]) done++;
    }
    return { habit:h, elapsed, done, pct: elapsed?Math.round(done/elapsed*100):0 };
  }).filter(Boolean);
  const avgPct = results.length ? Math.round(results.reduce((a,r)=>a+r.pct,0)/results.length) : 0;
  return { results, avgPct };
}
function sportStatsForRange(start,end){
  let totalReps = 0;
  let bestSet = null; // {exerciseName, reps}
  let bestDay = null; // {date, total}
  Object.keys(state.sportLogs).forEach(date => {
    if(date<start || date>end) return;
    let dayTotal = 0;
    Object.entries(state.sportLogs[date]).forEach(([exId, sets]) => {
      const ex = state.exercises.find(e=>e.id===exId);
      sets.forEach(n => {
        dayTotal += n;
        totalReps += n;
        if(!bestSet || n>bestSet.reps) bestSet = { exerciseName: ex?ex.name:'упражнение', reps:n, date };
      });
    });
    if(dayTotal>0 && (!bestDay || dayTotal>bestDay.total)) bestDay = { date, total:dayTotal };
  });
  const workouts = state.workouts.filter(w=>w.date>=start && w.date<=end);
  const measurements = state.measurements.filter(m=>m.date>=start && m.date<=end);
  return { totalReps, workoutsCount: workouts.length, measurementsCount: measurements.length, bestSet, bestDay };
}
function findRetro(mode, key){ return state.retros.find(r=>r.periodType===mode && r.periodKey===key); }
function prevPeriodKey(mode, cursor){
  if(mode==='week'){ const d=parseISO(cursor); d.setDate(d.getDate()-7); return isoDate(d); }
  return shiftMonth(cursor,-1);
}
function nextPeriodKey(mode, cursor){
  if(mode==='week'){ const d=parseISO(cursor); d.setDate(d.getDate()+7); return isoDate(d); }
  return shiftMonth(cursor,1);
}
function retroTrendData(mode, cursor, n=6){
  const points = [];
  let c = cursor;
  for(let i=0;i<n;i++){
    const { start, end } = periodRange(mode, c);
    const ts = tasksStatsForRange(start, end);
    const hs = habitsStatsForRange(start, end);
    const ss = sportStatsForRange(start, end);
    points.unshift({ key:c, taskPct: ts.total?Math.round(ts.done/ts.total*100):0, habitPct: hs.avgPct, sportReps: ss.totalReps, hasTaskData: ts.total>0, hasHabitData: hs.results.length>0, hasSportData: ss.totalReps>0 });
    c = prevPeriodKey(mode, c);
  }
  return points;
}
function trendConclusion(points, key, hasKey){
  const withData = points.filter(p=>p[hasKey]);
  if(withData.length<2) return null;
  const last = withData[withData.length-1];
  const prev = withData[withData.length-2];
  const diff = last[key]-prev[key];
  const threshold = Math.max(1, Math.abs(prev[key])*0.03);
  const dir = diff>threshold ? 'up' : diff<-threshold ? 'down' : 'flat';
  return { dir, diff, current: last[key] };
}
function trendChartHTML(points, key, hasKey, color, label, unit=''){
  const c = trendConclusion(points, key, hasKey);
  const dirMeta = { up:{arrow:'↑', word:'растёт', color:'var(--habit)'}, down:{arrow:'↓', word:'снижается', color:'var(--danger)'}, flat:{arrow:'→', word:'стабильно', color:'var(--text-faint)'} };
  const dm = c ? dirMeta[c.dir] : null;
  const dataMax = Math.max(1, ...points.filter(p=>p[hasKey]).map(p=>p[key]));
  const scaleMax = unit==='%' ? 100 : dataMax;
  const barAreaH = 52;
  const gap = 20; // место под подпись значения над столбиком
  const chartH = barAreaH - gap;
  return `
    <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">
      <span class="hint" style="margin:0;">${label}</span>
      ${c ? `<span style="font-size:12px; font-weight:800; color:${dm.color};">${dm.arrow} ${c.current}${unit} · ${dm.word}${c.diff!==0?` (${c.diff>0?'+':''}${c.diff}${unit})`:''}</span>` : ''}
    </div>
    <div style="display:flex; gap:6px; margin-bottom:10px;">
      <div style="position:relative; width:20px; flex:0 0 20px; height:${barAreaH}px;">
        <span style="position:absolute; top:${gap-5}px; right:2px; font-size:8px; color:var(--text-faint);">${Math.round(scaleMax)}</span>
        <span style="position:absolute; top:${gap+chartH/2-5}px; right:2px; font-size:8px; color:var(--text-faint);">${Math.round(scaleMax/2)}</span>
        <span style="position:absolute; bottom:0; right:2px; font-size:8px; color:var(--text-faint);">0</span>
      </div>
      <div style="flex:1; position:relative; height:${barAreaH}px;">
        <div style="position:absolute; left:0; right:0; top:${gap}px; border-top:1px dashed var(--border);"></div>
        <div style="position:absolute; left:0; right:0; top:${gap+chartH/2}px; border-top:1px dashed var(--border);"></div>
        <div style="position:absolute; left:0; right:0; bottom:0; border-top:1px solid var(--border);"></div>
        <div style="display:flex; align-items:flex-end; gap:4px; height:${barAreaH}px; position:relative;">
          ${points.map(p => {
            const has = p[hasKey];
            const h = has ? Math.max(3, Math.round(p[key]/scaleMax*chartH)) : 2;
            return `<div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:3px; height:100%;">
              <span style="font-size:9.5px; font-weight:800; color:${has?'var(--text-muted)':'var(--text-faint)'};">${has?p[key]:'–'}</span>
              <div style="width:100%; height:${h}px; background:${has?color:'var(--border)'}; opacity:${has?1:0.4}; border-radius:2px;"></div>
            </div>`;
          }).join('')}
        </div>
      </div>
    </div>
  `;
}
function journalStatsForRange(start,end){

function exportRetroText(mode, cursor, taskStats, habitStats, sportStats, journalStats, highlight, text, incomplete){
  let out = `Ретро — ${retroPeriodLabel(mode,cursor)}\n\n`;
  if(highlight) out += `Главное событие: ${highlight}\n\n`;
  out += `Задачи: ${taskStats.done}/${taskStats.total}\n`;
  out += `  Работа: ${taskStats.work.done}/${taskStats.work.total}\n  Дом: ${taskStats.home.done}/${taskStats.home.total}\n  Другое: ${taskStats.other.done}/${taskStats.other.total}\n\n`;
  out += `Привычки: средняя выполненность ${habitStats.avgPct}%\n`;
  habitStats.results.forEach(r => { out += `  ${r.habit.name}: ${r.done}/${r.elapsed} (${r.pct}%)\n`; });
  out += `\nСпорт: ${sportStats.totalReps} повторений, ${sportStats.workoutsCount} тренировок, ${sportStats.measurementsCount} замеров\n`;
  if(journalStats.avg!==null) out += `\nДневник: средняя оценка ${journalStats.avg.toFixed(1)}★ (записей: ${journalStats.entries.length})\n`;
  if(incomplete.length){

    incomplete.forEach(t => { out += `  - ${t.text}${t.date?' ('+fmtHuman(t.date)+')':''}\n`; });
  }
  if(text) out += `\nРефлексия:\n${text}\n`;
  return out;
}
function downloadTextFile(filename, text){
  const blob = new Blob([text], { type:'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
