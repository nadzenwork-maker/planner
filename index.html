  for(let i=0;i<n;i++){
    const arr = mode==='month' ? state.goalsMonthly.filter(g=>g.month===c) : state.goalsWeekly.filter(g=>g.weekStart===c);
    points.unshift({ pct: arr.length?Math.round(arr.filter(g=>g.done).length/arr.length*100):0, has: arr.length>0 });
    c = mode==='month' ? shiftMonth(c,-1) : (()=>{ const d=parseISO(c); d.setDate(d.getDate()-7); return isoDate(d); })();
  }
  return points;
}
function renderGoals(){
  const monthGoals = state.goalsMonthly.filter(g=>g.month===goalsMonthCursor);
  const weekGoals = state.goalsWeekly.filter(g=>g.weekStart===goalsWeekCursor);
  const [y,m] = goalsMonthCursor.split('-').map(Number);
  const mDone = monthGoals.filter(g=>g.done).length, mPct = monthGoals.length?Math.round(mDone/monthGoals.length*100):0;
  const wDone = weekGoals.filter(g=>g.done).length, wPct = weekGoals.length?Math.round(wDone/weekGoals.length*100):0;
  const mTrend = goalsTrendData('month', goalsMonthCursor);
  const wTrend = goalsTrendData('week', goalsWeekCursor);

  const html = `
    <div class="goals-grid">
      <div>
        <div class="cal-header">
          <button class="cal-nav" id="gmPrev">${icon('chevLeft')}</button>
          <h2>${MONTHS_NOM[m-1]} ${y}</h2>
          <button class="cal-nav" id="gmNext">${icon('chevRight')}</button>
        </div>
        ${monthGoals.length ? `
          <div class="card" style="padding:12px 14px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
              <span style="font-size:20px; font-weight:800; font-family:'Manrope'; color:var(--goal);">${mPct}%</span>
              <span class="hint" style="margin:0;">${mDone} из ${monthGoals.length} выполнено</span>
            </div>
            <div style="height:7px; border-radius:4px; background:var(--surface2); overflow:hidden; margin-bottom:10px;">
              <div style="height:100%; width:${mPct}%; background:var(--goal);"></div>
            </div>
            ${trendChartHTML(mTrend, 'pct', 'has', 'var(--goal)', 'Тренд по месяцам', '%')}
          </div>
        ` : ''}
        <div class="quickadd"><input type="text" id="gmInput" placeholder="Цель на месяц"><button id="gmAdd">${icon('plus')}</button></div>
        <div id="gmList" style="margin-bottom:8px"></div>
      </div>

      <div>
        <div class="cal-header">
          <button class="cal-nav" id="gwPrev">${icon('chevLeft')}</button>
          <h2>${weekLabel(goalsWeekCursor)}</h2>
          <button class="cal-nav" id="gwNext">${icon('chevRight')}</button>
        </div>
        ${weekGoals.length ? `
          <div class="card" style="padding:12px 14px;">
            <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
              <span style="font-size:20px; font-weight:800; font-family:'Manrope'; color:var(--goal);">${wPct}%</span>
              <span class="hint" style="margin:0;">${wDone} из ${weekGoals.length} выполнено</span>
            </div>
            <div style="height:7px; border-radius:4px; background:var(--surface2); overflow:hidden; margin-bottom:10px;">
              <div style="height:100%; width:${wPct}%; background:var(--goal);"></div>
            </div>
            ${trendChartHTML(wTrend, 'pct', 'has', 'var(--goal)', 'Тренд по неделям', '%')}
          </div>
        ` : ''}
        <div class="quickadd"><input type="text" id="gwInput" placeholder="Цель на неделю"></div>
        <div class="field" style="margin-bottom:8px">
          <select id="gwLink">
            <option value="">Без связи с целью месяца</option>
            ${monthGoals.map(g=>`<option value="${g.id}">${escapeHtml(g.text)}</option>`).join('')}
          </select>
        </div>
        <button class="btn btn-primary" id="gwAdd" style="background:var(--goal); width:100%; margin-bottom:12px;">Добавить недельную цель</button>
        <div id="gwList"></div>
      </div>
    </div>
  `;
  $('#tab-goals').innerHTML = html;

  const gmEl = $('#gmList');
  gmEl.innerHTML = monthGoals.length ? monthGoals.map(g => `
    <div class="goalrow">
      <button class="checkbox ${g.done?'done':''}" style="${g.done?'background:var(--goal);border-color:var(--goal)':''}" data-gmtoggle="${g.id}">${icon('check')}</button>
      <span class="gtext ${g.done?'done':''}">${escapeHtml(g.text)}</span>
      <button class="delbtn" data-gmdel="${g.id}">${icon('x')}</button>
    </div>`).join('') : `<div class="empty">Целей на месяц пока нет</div>`;
  $$('[data-gmtoggle]', gmEl).forEach(b => b.addEventListener('click', ()=>{
    const g = state.goalsMonthly.find(x=>x.id===b.dataset.gmtoggle); g.done=!g.done; persistGoals(); renderGoals();
  }));
  $$('[data-gmdel]', gmEl).forEach(b => b.addEventListener('click', ()=>{
    state.goalsMonthly = state.goalsMonthly.filter(x=>x.id!==b.dataset.gmdel); persistGoals(); renderGoals();
  }));
  $('#gmAdd').addEventListener('click', ()=>{
    const inp = $('#gmInput'); if(!inp.value.trim()) return;
    state.goalsMonthly.push({ id: uid(), month: goalsMonthCursor, text: inp.value.trim(), done:false });
    inp.value=''; persistGoals(); renderGoals();
  });
  $('#gmPrev').addEventListener('click', ()=>{ goalsMonthCursor = shiftMonth(goalsMonthCursor,-1); renderGoals(); });
  $('#gmNext').addEventListener('click', ()=>{ goalsMonthCursor = shiftMonth(goalsMonthCursor,1); renderGoals(); });

  const gwEl = $('#gwList');
  gwEl.innerHTML = weekGoals.length ? weekGoals.map(g => {
    const linked = state.goalsMonthly.find(m=>m.id===g.linkedGoalId);
    return `
    <div class="goalrow" style="flex-wrap:wrap;">
      <button class="checkbox ${g.done?'done':''}" style="${g.done?'background:var(--goal);border-color:var(--goal)':''}" data-gwtoggle="${g.id}">${icon('check')}</button>
      <div style="flex:1">
        <span class="gtext ${g.done?'done':''}">${escapeHtml(g.text)}</span>
        ${linked?`<div class="goal-link-tag">→ ${escapeHtml(linked.text)}</div>`:''}
      </div>
      <button class="delbtn" data-gwdel="${g.id}">${icon('x')}</button>
    </div>`;
  }).join('') : `<div class="empty">Целей на неделю пока нет</div>`;
  $$('[data-gwtoggle]', gwEl).forEach(b => b.addEventListener('click', ()=>{
    const g = state.goalsWeekly.find(x=>x.id===b.dataset.gwtoggle); g.done=!g.done; persistGoals(); renderGoals();
  }));
  $$('[data-gwdel]', gwEl).forEach(b => b.addEventListener('click', ()=>{
    state.goalsWeekly = state.goalsWeekly.filter(x=>x.id!==b.dataset.gwdel); persistGoals(); renderGoals();
  }));
  $('#gwAdd').addEventListener('click', ()=>{
    const inp = $('#gwInput'); if(!inp.value.trim()) return;
    state.goalsWeekly.push({ id: uid(), weekStart: goalsWeekCursor, text: inp.value.trim(), linkedGoalId: $('#gwLink').value||null, done:false });
    inp.value=''; persistGoals(); renderGoals();
  });
  $('#gwPrev').addEventListener('click', ()=>{ const d=parseISO(goalsWeekCursor); d.setDate(d.getDate()-7); goalsWeekCursor=isoDate(d); renderGoals(); });
  $('#gwNext').addEventListener('click', ()=>{ const d=parseISO(goalsWeekCursor); d.setDate(d.getDate()+7); goalsWeekCursor=isoDate(d); renderGoals(); });
}

/* ============================= INIT ============================= */
let appStarted = false;
async function startApp(){
  if(appStarted) return; appStarted = true;
  $('#loginScreen').style.display = 'none';
  $('#loadingScreen').style.display = '';
  renderAllHeader();
  renderNav();
  $('#settingsBtn').innerHTML = icon('settings');
  $('#settingsBtn').addEventListener('click', openSettingsModal);
  $('#syncBadge').addEventListener('click', ()=>{ if(syncStatus==='error'||syncStatus==='offline') retryAllSaves(); });
  const sbOk = await testSupabase();
  storageMode = sbOk ? 'supabase' : 'claude';
  setSyncStatus('saved');
  await loadAll();
  renderDay();
  $('#loadingScreen').style.display = 'none';
}
function showLogin(msg){
  $('#loadingScreen').style.display = 'none';
  $('#loginScreen').style.display = '';
  if(msg) $('#loginMsg').textContent = msg;
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginMsg').textContent = 'Вхожу…';
  const { error } = await sbClient.auth.signInWithPassword({ email: $('#loginEmail').value.trim(), password: $('#loginPass').value });
  if(error){ $('#loginMsg').textContent = /invalid/i.test(error.message) ? 'Почта или пароль не подходят.' : 'Не получилось: ' + error.message; return; }
  startApp();
});
$('#forgotBtn').addEventListener('click', async () => {
  $('#loginMsg').textContent = 'Отправляю письмо…';
  const { error } = await sbClient.auth.resetPasswordForEmail($('#loginEmail').value.trim(), { redirectTo: location.origin + location.pathname });
  $('#loginMsg').textContent = error ? 'Не получилось: ' + error.message : 'Письмо отправлено. Перейди по ссылке из него — здесь появится поле для нового пароля.';
});
$('#newPassForm').addEventListener('submit', async e => {
  e.preventDefault();
  const { error } = await sbClient.auth.updateUser({ password: $('#newPass').value });
  if(error){ $('#loginMsg').textContent = 'Не получилось: ' + error.message; return; }
  startApp();
});
sbClient.auth.onAuthStateChange((ev) => {
  if(ev === 'PASSWORD_RECOVERY'){
    showLogin('Придумай новый пароль.');
    $('#loginForm').style.display = 'none'; $('#forgotBtn').style.display = 'none'; $('#newPassForm').style.display = '';
  }
});
async function signOut(){ await sbClient.auth.signOut(); try{ Object.keys(localStorage).filter(k=>k.startsWith(LOCAL_PREFIX)).forEach(k=>localStorage.removeItem(k)); }catch(e){} location.reload(); }
// вернулась во вкладку — подтягиваем то, что мог поменять Майк
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState !== 'visible' || !appStarted || pendingKeys.size) return;
  if($('#modalBackdrop').classList.contains('open')) return;
  try{ await loadAll(); renderActive(); }catch(e){}
});
(async function init(){
  if(/type=recovery/.test(location.hash + location.search)) return; // ждём PASSWORD_RECOVERY
  const { data } = await sbClient.auth.getSession();
  const email = data.session && (data.session.user.email||'').toLowerCase();
  if(email === OWNER_EMAIL) startApp();
  else { if(data.session) await sbClient.auth.signOut(); showLogin(); }
})();
</script>
